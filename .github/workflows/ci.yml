name: CI
# 只在 main 的 push 与所有 PR 上跑。feat/** 的 push 不再单独触发——否则同一
# commit 会因 push + pull_request 各跑一次：要么排队（旧问题），要么被
# cancel-in-progress 取消而在 PR 上显示成失败（更糟）。分支工作一律走 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests + coverage
        run: npm test -- --coverage

      - name: CSS manifest check
        run: bash scripts/css-manifest-check.sh

      # E2E requires system Chrome — skip in CI for now
      # (requires npx playwright install chromium with system deps)
