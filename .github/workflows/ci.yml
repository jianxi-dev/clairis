name: CI
# 只在 main 的 push 与所有 PR 上跑。feat/** 的 push 不再单独触发——否则同一
# commit 会因 push + pull_request 各跑一次：要么排队（旧问题），要么被
# cancel-in-progress 取消而在 PR 上显示成失败（更糟）。分支工作一律走 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # 这一步只跑 tsc / vitest / CSS manifest，没有任何 macOS 专属动作；
    # 放在 macos-latest 上既排队又烧额度（2026-11-03 连续四次拿不到 runner，
    # job 根本没启动就被取消）。cargo 尚未纳入 CI，所以 Rust 工具链也一并去掉。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # cargo check 尚未纳入 CI。要加时单独开一个 job，别和 web 检查抢同一个
      # runner 的墙钟时间。

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests + coverage
        run: npm test -- --coverage

      - name: CSS manifest check
        run: bash scripts/css-manifest-check.sh

      # E2E requires system Chrome — skip in CI for now
      # (requires npx playwright install chromium with system deps)
