name: CI
on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

# 同一分支的 push 与 pull_request 会各触发一次（同一 commit 两个 run）。
# 并发组按分支收敛：新 run 起来就取消旧的，避免同一 sha 出现两个 verify、
# 也避免排队占用 macOS runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests + coverage
        run: npm test -- --coverage

      - name: CSS manifest check
        run: bash scripts/css-manifest-check.sh

      # E2E requires system Chrome — skip in CI for now
      # (requires npx playwright install chromium with system deps)
