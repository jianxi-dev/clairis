name: CI
# 只在 main 的 push 与所有 PR 上跑。feat/** 的 push 不再单独触发——否则同一
# commit 会因 push + pull_request 各跑一次：要么排队（旧问题），要么被
# cancel-in-progress 取消而在 PR 上显示成失败（更糟）。分支工作一律走 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # tsc / vitest / CSS manifest，没有任何 macOS 专属动作；
    # 放在 macos-latest 上既排队又烧额度（2026-11-03 连续四次拿不到 runner，
    # job 根本没启动就被取消）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests + coverage
        run: npm test -- --coverage

      - name: CSS manifest check
        run: bash scripts/css-manifest-check.sh

      # #1647：token 门禁全量（A 裸色值 / B 双向对账 / C 对比度）。
      - name: Token gate
        run: node scripts/check-tokens.mjs

      # #1648：交互门禁（零横线 / 原生对话框零新增）。
      - name: Interaction gate
        run: node scripts/check-interaction.mjs

      # #1442：规格/实现/锚点三方一致性。#1434 已裁决（32 为有意收紧）且
      # menu-geometry-spec-sync 已归档同步主规格，无豁免项，跑 --strict。
      - name: Anchor consistency check
        run: bash scripts/anchor-consistency-check.sh --strict

  rust-tests:
    # #1441：135 个 #[test] 此前不在任何交付链路执行（ci.yml 与 verify.sh 都只
    # cargo check）。独立 job，不与 web 检查抢墙钟。tauri v2 在 linux 编译需要
    # webkit/gtk 系统库，装依赖 + rust-cache 控制墙钟。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e-smoke:
    # #1441：冒烟子集（3 个高价值低抖动的 mock 驱动 spec）。选自近期稳定跑绿的
    # 用例；完整 e2e 仍走本地 verify.sh（860+ 用例在 ubuntu runner 上不现实）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke subset
        run: npx playwright test --config=playwright.smoke.config.ts
