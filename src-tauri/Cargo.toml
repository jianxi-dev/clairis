[package]
name = "folio"
version = "0.1.0"
description = "Folio — Lightweight Markdown Reader/Editor"
authors = ["you"]
edition = "2021"

[lib]
name = "folio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
keyring = "3"
tempfile = "3"
tracing = "0.1"
