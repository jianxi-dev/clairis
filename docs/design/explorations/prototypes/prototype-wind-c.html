<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind C · Breath</title>
<style>
:root {
  --bg: #0d0f12;
  --ink: #1e2028;
  --gold: #fbbf24;
  --gold-dim: rgba(251, 191, 36, 0.15);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; background: var(--bg);
  font-family: 'Literata', serif; color: #fff; user-select: none;
}
textarea {
  width: 100%; height: 100%;
  background: transparent; border: none; outline: none;
  resize: none; padding: 120px 200px;
  font-size: 22px; line-height: 1.8; color: #fff;
  text-align: center; position: relative; z-index: 10;
}
textarea::placeholder { color: #3a3d44; font-style: italic; }
#ring {
  position: fixed; inset: 0; z-index: 5;
  border: 2px solid var(--gold-dim);
  pointer-events: none;
  transition: border-width 0.15s, border-color 0.15s, box-shadow 0.15s, left 0.15s, top 0.15s, width 0.15s, height 0.15s, border-radius 0.15s;
  border-radius: 8px; margin: 20px;
}
#ring.inhale {
  border-color: var(--gold);
  border-width: 4px;
  border-radius: 20px;
  box-shadow: 0 0 60px var(--gold-dim), inset 0 0 60px var(--gold-dim);
}
#gauge {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%);
  width: 240px; height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px; z-index: 20;
  overflow: hidden;
}
#gauge-fill {
  height: 100%; width: 0%; background: var(--gold);
  transition: width 0.1s;
}
#hint {
  position: fixed; bottom: 70px; left: 50%;
  transform: translateX(-50%);
  z-index: 20; font-family: 'Inter', sans-serif;
  font-size: 11px; color: #4a4d54; letter-spacing: 0.03em;
}
.fragments {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
.frag {
  position: absolute; font-size: 16px; line-height: 1.6;
  color: #fff; padding: 3px 6px;
  border-radius: 4px;
  background: rgba(30,32,40,0.6);
  white-space: nowrap;
  transition: all 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.frag.exhaling {
  opacity: 0.3; transform: scale(0.4);
  filter: blur(1px);
}
.saver {
  position: fixed; top: 30px; right: 40px;
  background: rgba(251, 191, 36, 0.12);
  border: 1px solid var(--gold);
  color: var(--gold); border-radius: 20px;
  padding: 7px 18px; cursor: pointer;
  font-size: 12px; font-family: 'Inter', sans-serif; z-index: 20;
  display: none;
}
.saver.active { display: inline-block; }
</style>
</head>
<body>

<textarea id="ta" placeholder="按住空格·吸气&#10;聚集文字目光观察&#10;&#10;松开空格·呼气&#10;吹散回虚空"></textarea>
<div id="ring"></div>
<div class="fragments"></div>
<div id="gauge"><div id="gauge-fill"></div></div>
<span id="hint">按压空格吸入 · 松开呼出 · 重复呼吸</span>
<div class="save-btn saver" id="save" onclick="finishBreath()">驻留</div>

<script>
const ta = document.getElementById('ta');
const ring = document.getElementById('ring');
const fill = document.getElementById('gauge-fill');
const fragLayer = document.querySelector('.fragments');
const hint = document.getElementById('hint');
const save = document.getElementById('save');

let inhaling = false;
let breathProgress = 0;
let breathTimer = null;
let phrasePool = [
  "设计的本质不是解决问题",
  "而是发现真正的命题",
  "注意力经济的核心悖论",
  "我们以为是工具使用我们",
  "沉默需求比可诉说的需求更重",
  "去掉侧栏需要等价物",
  "舒适不来自选项多",
  "而是来自选择少",
  "控制感不等于控制",
  "水消失在水里"
];

ta.addEventListener('input', () => {
  if (inhaling) return;
  if (ta.value.length > 2) {
    hint.textContent = '按空格聚集 · ' + ta.value.length + ' 字';
  } else {
    hint.textContent = '按住空格·吸气';
  }
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !inhaling && document.activeElement !== ta) {
    e.preventDefault();
    startInhale();
    ta.focus();
  }
  if (e.code === 'Space' && document.activeElement === ta) return;
});

document.addEventListener('keyup', e => {
  if (e.code === 'Space' && inhaling) {
    e.preventDefault();
    startExhale();
  }
});

function startInhale() {
  inhaling = true;
  ring.classList.add('inhale');
  hint.textContent = '吸入… 注视这些文字…';
  save.classList.remove('active');
  ta.setAttribute('readonly', '');
  ta.value = '';

  breathTimer = setInterval(() => {
    breathProgress = Math.min(100, breathProgress + 100/30);
    fill.style.width = breathProgress + '%';

    if (breathProgress > 80) {
      ring.style.borderWidth = '8px';
      ring.style.boxShadow = '0 0 100px rgba(251,191,36,0.4), inset 0 0 100px rgba(251,191,36,0.1)';
    }
    if (breathProgress < 50 && ta.value.length < 8) {
      ta.value = ta.value + phrasePool[Math.floor(Math.random()*phrasePool.length)] + ' ';
    }
  }, 100);
}

function startExhale() {
  inhaling = false;
  clearInterval(breatatherTimer);
  ring.classList.remove('inhale');
  ring.style.borderWidth = '';
  ring.style.boxShadow = '';
  hint.textContent = '呼出…';
  ta.removeAttribute('readonly');

  // Slowly decay breath
  let decay = setInterval(() => {
    breathProgress = Math.max(0, breathProgress - 5);
    fill.style.width = breathProgress + '%';
    if (breathProgress <= 0) {
      clearInterval(decay);
      ring.style.margin = '20px';
      ring.style.borderRadius = '8px';
      ring.style.opacity = '';
      save.classList.add('active');
      hint.textContent = '驻留此次呼吸 · 或再次吸气';
    }
  }, 50);

  // Exhale — spawn text fragments
  const text = ta.value.trim();
  if (!text) return;
  const words = text.split(/\s+/);
  const fragments = [];
  let buf = '';
  words.forEach((w, i) => {
    buf += (buf ? ' ' : '') + w;
    if (buf.length > 6 || i === words.length - 1) {
      fragments.push(buf); buf = '';
    }
  });

  fragments.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'frag';
    el.textContent = f;
    el.style.left = (window.innerWidth/2 + (Math.random()-0.5)*60) + 'px';
    el.style.top = (window.innerHeight/2 + (Math.random()-0.5)*40) + 'px';
    el.style.opacity = '1';
    el.style.transform = 'scale(1)';
    fragLayer.appendChild(el);

    setTimeout(() => {
      const angle = Math.random() * Math.PI * 2;
      const radius = 120 + Math.random() * 200;
      el.style.left = (window.innerWidth/2 - el.offsetWidth/2 + Math.cos(angle) * radius) + 'px';
      el.style.top = (window.innerHeight/2 - el.offsetHeight/2 + Math.sin(angle) * radius) + 'px';
      el.classList.add('exhaling');
    }, 50);
  });

  ta.value = '';
}

function finishBreath() {
  const frags = document.querySelectorAll('.frag');
  frags.forEach(f => {
    f.style.transition = 'all 1s';
    f.style.opacity = '0';
    f.style.transform = 'scale(0.1)';
  });
  setTimeout(() => { fragLayer.innerHTML = ''; }, 1000);
  save.classList.remove('active');
  hint.textContent = '驻留完成 · 吸气重新开始';
  ta.placeholder = '你驻留了本次呼吸。\n\n再次按住空格，新的呼吸开始。';
}
</script>
</body>
</html>
