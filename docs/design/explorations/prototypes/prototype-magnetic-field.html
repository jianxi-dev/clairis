<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic Field</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100%; height: 100%; overflow: hidden; background: #08080e; font-family: Georgia, serif; user-select: none; }

.node {
  position: absolute; z-index: 2; cursor: grab;
  padding: 16px 20px; border-radius: 14px;
  max-width: 250px; min-width: 150px;
  font-size: 13px; line-height: 1.55; color: #e0e0e0;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.07);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  transform-origin: top left;
}
.node:active { cursor: grabbing; }
.node.dragging { z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
.node.pinned { border-color: rgba(255,200,60,0.5) !important; }

.cluster-blue { background: linear-gradient(135deg, rgba(50,70,140,0.6), rgba(35,45,90,0.4)); }
.cluster-amber { background: linear-gradient(135deg, rgba(140,100,35,0.6), rgba(90,65,20,0.4)); }
.cluster-green { background: linear-gradient(135deg, rgba(35,110,75,0.6), rgba(20,65,45,0.4)); }
.cluster-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; margin-bottom: 5px; font-family: monospace; }
.pin-icon { position: absolute; top: 6px; right: 10px; font-size: 10px; opacity: 0.3; font-family: monospace; }
.node:hover .pin-icon { opacity: 0.8; }

#svg-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

#ui { position: fixed; top: 20px; left: 20px; z-index: 200; color: rgba(255,255,255,0.6); font-family: monospace; font-size: 11px; line-height: 1.8; pointer-events: none; }
#ui h1 { font-size: 14px; letter-spacing: 2px; margin-bottom: 6px; color: rgba(255,255,255,0.85); }
#hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; color: rgba(255,255,255,0.3); font-family: monospace; font-size: 10px; text-align: center; pointer-events: none; }
</style>
</head>
<body>

<svg id="svg-layer"></svg>

<div id="ui">
  <h1>MAGNETIC FIELD</h1>
  <div id="count"></div>
</div>

<div id="hint">点击空白 = 新建 · 拖拽 = 移动 · 右键 = 钉住</div>

<script>
const SNIPPETS = [
  { text: "Architecture is about time, not space. The body moves through compression and release.", cluster: 0 },
  { text: "A room responds to seasons, to light, to lives within its walls.", cluster: 0 },
  { text: "Ceiling height determines thought. Low = intimacy, high = aspiration.", cluster: 0 },
  { text: "Thresholds matter more than destinations. The doorway is where architecture lives.", cluster: 0 },
  { text: "First draft is telling yourself the story. Real editing happens when you write for others.", cluster: 1 },
  { text: "A sentence leads to the next as breath follows breath. Rhythm is meaning.", cluster: 1 },
  { text: "Writing is thinking made visible. The pen discovers what the mind has hidden.", cluster: 1 },
  { text: "Good design is invisible. When people marvel at the interface, the design has failed.", cluster: 2 },
  { text: "Constraints are not the enemy of creativity but its catalyst.", cluster: 2 },
  { text: "Every optimization creates a new problem. The art is choosing which problems to live with.", cluster: 2 },
  { text: "Color is not decoration. Color is information.", cluster: 2 },
];

const COLORS = ['#5b85ff', '#f0a030', '#30c080'];
const NAMES = ['Arch', 'Write', 'Design'];

let nodes = [], idCounter = 0, dragging = null, offset = {x:0,y:0};
let bounds = { w: window.innerWidth, h: window.innerHeight };
window.addEventListener('resize', () => { bounds.w = window.innerWidth; bounds.h = window.innerHeight; });

const svg = document.getElementById('svg-layer');

function randSnippet() { return SNIPPETS[Math.floor(Math.random() * SNIPPETS.length)]; }
function sameCluster(a, b) { return a.s.cluster === b.s.cluster; }

// Compute similarity between two nodes
function similarity(a, b) {
  if (sameCluster(a, b)) return 0.85;
  return 0.15 + Math.random() * 0.1;
}

function createNode(x, y, s) {
  const n = { id: idCounter++, x, y, vx: 0, vy: 0, w: 190, h: 65, pinned: false, s: s || randSnippet() };
  const el = document.createElement('div');
  el.className = 'node cluster-' + ['blue','amber','green'][n.s.cluster];
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.innerHTML = `<span class="pin-icon">${NAMES[n.s.cluster][0]}</span>
    <div class="cluster-label" style="color:${COLORS[n.s.cluster]}">${NAMES[n.s.cluster]}</div>
    <div>${n.s.text}</div>`;
  el.addEventListener('mousedown', e => { if (e.button===0) startDrag(e, n); else if (e.button===2) { e.preventDefault(); pin(n); } });
  el.addEventListener('contextmenu', e => { e.preventDefault(); pin(n); });
  document.body.appendChild(el);
  n.el = el;
  setTimeout(() => { const r = el.getBoundingClientRect(); n.w = r.width; n.h = r.height; }, 16);
  nodes.push(n);
  return n;
}

function startDrag(e, n) {
  e.preventDefault(); n.el.classList.add('dragging'); n.pinned = false; n.el.classList.remove('pinned');
  dragging = n; offset.x = e.clientX - n.x; offset.y = e.clientY - n.y;
}
function pin(n) { n.pinned = !n.n; n.el.classList.toggle('pinned', n.pinned); }

// === PHYSICS: simple constrained system ===
function step() {
  const cx = bounds.w / 2, cy = bounds.h / 2;
  const damp = 0.88;
  
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a.pinned && a !== dragging) continue;
    let fx = 0, fy = 0;
    
    // Inter-node force
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const sim = similarity(a, b);
      
      // Same cluster pulls closer, different clusters pushes apart
      if (sim > 0.5) {
        // attraction toward same cluster
        const ideal = 180;
        const f = (dist - ideal) * 0.0008;
        fx += (dx/dist) * f;
        fy += (dy/dist) * f;
      } else {
        // repulsion from different clusters
        const ideal = 350;
        const f = (dist - ideal) * 0.0015;
        fx += (dx/dist) * f;
        fy += (dy/dist) * f;
      }
    }
    
    // Pull toward visible center (so they fill the screen, not cluster at middle)
    const targetX = cx + (a.x - cx) * 0.0001;
    const targetY = cy + (a.y - cy) * 0.0001;
    const dCx = targetX - a.x, dCy = targetY - a.y;
    fx += dCx * 0.00005;
    fy += dCy * 0.00005;
    
    // Soft boundary
    const margin = 70;
    if (a.x < margin) fx += 2 + (margin - a.x) * 0.1;
    if (a.x > bounds.w - a.w - margin) fx -= 2 + (a.x - bounds.w + a.w + margin) * 0.1;
    if (a.y < margin) fy += 2 + (margin - a.y) * 0.1;
    if (a.y > bounds.h - a.h - margin) fy -= 2 + (a.y - bounds.h + a.h + margin) * 0.1;
    
    a.vx = (a.vx + fx) * damp;
    a.vy = (a.vy + fy) * damp;
    
    // Cap velocity much lower for gentleness
    const maxV = 3;
    const spd = Math.sqrt(a.vx*a.vx + a.vy*a.vy);
    if (spd > maxV) { a.vx = a.vx / spd * maxV; a.vy = a.vy / spd * maxV; }
    
    if (!a.pinned || a === dragging) {
      a.x += a.vx; a.y += a.vy;
      a.x = Math.max(30, Math.min(bounds.w - a.w - 30, a.x));
      a.y = Math.max(30, Math.min(bounds.h - a.h - 30, a.y));
    }
  }
}

function drawLines() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  // Only draw lines to same-cluster neighbors
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      if (!sameCluster(nodes[i], nodes[j])) continue;
      const a = nodes[i], b = nodes[j];
      const dist = Math.sqrt(Math.pow(a.x-b.x,2) + Math.pow(a.y-b.y,2));
      if (dist > 600) continue;
      const op = Math.max(0.05, 0.4 - dist * 0.0005);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', a.x + a.w/2); line.setAttribute('y1', a.y + a.h/2);
      line.setAttribute('x2', b.x + b.w/2); line.setAttribute('y2', b.y + b.h/2);
      line.setAttribute('stroke', COLORS[a.s.cluster]);
      line.setAttribute('stroke-width', 1.5);
      line.setAttribute('stroke-opacity', op);
      line.setAttribute('stroke-linecap', 'round');
      svg.appendChild(line);
    }
  }
}

function render() {
  for (const n of nodes) { n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; }
}

function tick() {
  step(); render(); drawLines();
  requestAnimationFrame(tick);
}

document.addEventListener('mousemove', e => {
  if (dragging) {
    dragging.x = e.clientX - offset.x;
    dragging.y = e.clientY - offset.y;
    dragging.vx = 0; dragging.vy = 0;
  }
});
document.addEventListener('mouseup', () => { if (dragging) { dragging.el.classList.remove('dragging'); dragging = null; } });
document.addEventListener('mousedown', e => {
  if (e.button === 0 && !dragging && e.target === document.body) {
    createNode(e.clientX - 90, e.clientY - 30);
  }
});
document.addEventListener('contextmenu', e => e.preventDefault());

// Initialize near center
const cx = bounds.w/2, cy = bounds.h/2;
const r = Math.min(bounds.w, bounds.h) * 0.18;
for (let i = 0; i < 9; i++) {
  const angle = (i/9)*Math.PI*2 + Math.random()*0.4;
  const dist = r * (0.5 + Math.random()*0.5);
  const x = cx + Math.cos(angle)*dist - 95;
  const y = cy + Math.sin(angle)*dist - 32;
  setTimeout(() => createNode(x, y, SNIPPETS[i % SNIPPETS.length]), i * 70);
}

tick();
</script>
</body>
</html>
