<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wind Writing A</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050507;font-family:'Georgia','Times New Roman',serif}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
  #bg-canvas{z-index:0}
  #fx-canvas{z-index:1;pointer-events:none}

  /* --- UI layer --- */
  .ui-layer{position:fixed;z-index:10;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:4vh;width:100%;pointer-events:none}

  /* Textarea */
  #write-area{
    pointer-events:auto;
    width:min(640px,86vw);
    min-height:140px;
    background:rgba(8,8,12,0.62);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    color:#e8e4dc;
    font-size:17px;
    line-height:1.65;
    padding:22px 26px;
    resize:vertical;
    outline:none;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    font-family:'Georgia',serif;
    letter-spacing:0.01em;
    transition:border-color .4s, box-shadow .4s;
  }
  #write-area::placeholder{color:rgba(255,255,255,0.18);font-style:italic}
  #write-area:focus{border-color:rgba(255,200,140,0.25)}

  /* Gauge */
  .gauge-wrap{
    pointer-events:auto;
    display:flex;align-items:center;gap:12px;
    opacity:0.5;transition:opacity .5s;
  }
  .gauge-wrap.active{opacity:1}
  .gauge-label{
    font-size:10px;letter-spacing:0.35em;text-transform:uppercase;
    color:rgba(255,255,255,0.45);font-family:monospace;
  }
  .gauge-track{
    width:200px;height:5px;border-radius:3px;
    background:rgba(255,255,255,0.06);overflow:hidden;position:relative;
  }
  .gauge-fill{
    height:100%;width:0%;border-radius:3px;
    background:linear-gradient(90deg,#1a6b8a,#e07a3c,#ff2d55);
    transition:width .25s ease-out;
    box-shadow:0 0 12px rgba(255,100,50,0.3);
  }
  .gauge-value{
    font-size:11px;font-family:monospace;color:rgba(255,255,255,0.5);
    min-width:36px;text-align:right;
  }

  /* Release button */
  #release-btn{
    pointer-events:auto;
    padding:8px 26px;
    background:transparent;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:20px;
    color:rgba(255,255,255,0.5);
    font-family:monospace;font-size:12px;letter-spacing:0.2em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .35s;
    opacity:0.4;
  }
  #release-btn:hover{
    border-color:rgba(255,200,140,0.4);
    color:rgba(255,220,180,0.85);
    box-shadow:0 0 18px rgba(255,160,80,0.15);
    opacity:1;
  }
  #release-btn.winding{
    border-color:rgba(255,120,60,0.5);
    color:rgba(255,180,120,0.9);
    opacity:1;
    animation:pulse-border 1.6s ease-in-out infinite;
  }
  @keyframes pulse-border{
    0%,100%{box-shadow:0 0 8px rgba(255,120,60,0.15)}
    50%{box-shadow:0 0 20px rgba(255,120,60,0.35)}
  }

  /* Hint */
  .hint{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    font-family:monospace;font-size:10px;letter-spacing:0.18em;
    color:rgba(255,255,255,0.2);z-index:10;pointer-events:none;
    transition:opacity .6s;
  }

  /* Cluster field */
  .cluster-field{
    position:fixed;bottom:0;left:0;width:100%;z-index:5;
    display:flex;flex-wrap:wrap-reverse;justify-content:center;
    gap:6px;padding:14px 24px 18px;
    pointer-events:none;
  }
  .fragment{
    font-family:'Georgia',serif;font-size:13px;
    color:rgba(255,255,255,0.5);
    background:rgba(20,18,22,0.7);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:6px;
    padding:6px 12px;
    max-width:260px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    animation:frag-in 1.4s cubic-bezier(.2,.8,.2,1) both;
    pointer-events:auto;
    cursor:default;
    transition:color .8s, border-color .8s;
  }
  .fragment:hover{color:rgba(255,255,255,0.8);border-color:rgba(255,200,140,0.2)}
  @keyframes frag-in{
    0%{opacity:0;transform:translateY(30px) scale(.85)}
    60%{opacity:1;transform:translateY(-3px) scale(1.02)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }

  /* Sprite fragment (floating in wind, before settling) */
  .sprite-frag{
    position:fixed;z-index:8;pointer-events:none;
    font-family:'Georgia',serif;font-size:15px;
    color:rgba(255,220,180,0.85);
    padding:4px 10px;white-space:nowrap;
    border-radius:4px;
    text-shadow:0 0 14px rgba(255,160,80,0.5);
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="fx-canvas"></canvas>

<div class="ui-layer">
  <textarea id="write-area" placeholder="Write something… the wind will listen." spellcheck="false"></textarea>
  <div class="gauge-wrap" id="gauge-wrap">
    <span class="gauge-label">Wind</span>
    <div class="gauge-track"><div class="gauge-fill" id="gauge-fill"></div></div>
    <span class="gauge-value" id="gauge-val">0</span>
  </div>
  <button id="release-btn">释 放</button>
</div>

<div class="cluster-field" id="cluster"></div>
<div class="hint" id="hint">Type to summon the wind &nbsp;·&nbsp; <strong>Esc</strong> to release</div>

<script>
/* ============================================================
   WIND WRITING A
   Text length drives wind intensity. Particles, background,
   colors all react. On release, wind calms, text fragments
   descend to the cluster field.
   ============================================================ */

(() => {
"use strict";

// ── DOM refs ──────────────────────────────────────────────
const bgCanvas  = document.getElementById('bg-canvas');
const fxCanvas  = document.getElementById('fx-canvas');
const bgCtx     = bgCanvas.getContext('2d');
const fxCtx     = fxCanvas.getContext('2d');
const textarea  = document.getElementById('write-area');
const gaugeFill = document.getElementById('gauge-fill');
const gaugeVal  = document.getElementById('gauge-val');
const gaugeWrap = document.getElementById('gauge-wrap');
const releaseBtn= document.getElementById('release-btn');
const clusterEl = document.getElementById('cluster');
const hint      = document.getElementById('hint');

// ── Sizing ────────────────────────────────────────────────
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  [bgCanvas, fxCanvas].forEach(c => { c.width = W; c.height = H; });
}
window.addEventListener('resize', resize);
resize();

// ── State ─────────────────────────────────────────────────
const MAX_CHARS   = 350;     // char count at which wind hits max
const PARTICLE_N  = 220;     // number of particles

let windForce  = 0;          // current smoothed wind 0–1
let targetWind = 0;          // target based on textarea
let time       = 0;
let calmTimer  = 0;          // counts down after release
let savedFragments = [];     // text strings saved

// ── Color mapping (cool calm → hot intense) ──────────────
function windColor(t, alpha=1) {
  // t: 0→1, interpolates blue → orange → crimson
  let r, g, b;
  if (t < 0.5) {
    const s = t * 2;
    r = Math.round(26  + (224 - 26)  * s);
    g = Math.round(107 + (122 - 107) * s);
    b = Math.round(138 + (60  - 138) * s);
  } else {
    const s = (t - 0.5) * 2;
    r = Math.round(224 + (255 - 224) * s);
    g = Math.round(122 + (45  - 122) * s);
    b = Math.round(60  + (85  - 60)  * s);
  }
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Particles ─────────────────────────────────────────────
class Particle {
  constructor() { this.reset(true); }
  reset(initial) {
    this.x  = Math.random() * W;
    this.y  = initial ? Math.random() * H : H + 10;
    this.vx = 0;
    this.vy = 0;
    this.size  = 0.6 + Math.random() * 2.8;
    this.alpha = 0.15 + Math.random() * 0.5;
    this.life  = 0;
    this.maxLife = 200 + Math.random() * 500;
    // type: 0=sharp dot, 1=soft smudge
    this.type  = Math.random() < 0.35 ? 1 : 0;
    // slight color variation
    this.hueShift = Math.random() * 0.3 - 0.15;
  }
  update(dt) {
    this.life += dt;
    if (this.life > this.maxLife || this.x < -30 || this.x > W + 30 || this.y < -30) {
      this.reset(false);
      return;
    }
    const w = windForce;
    // Wind pushes right + slight upward lift
    const turbX = (Math.sin(this.y * 0.013 + time * 0.8) + Math.cos(this.x * 0.009 - time * 1.1)) * 0.4;
    const turbY = (Math.cos(this.x * 0.011 + time * 0.7) + Math.sin(this.y * 0.008 + time * 0.5)) * 0.3;
    const baseSpeed = 0.4 + w * 5.5;
    this.vx += (baseSpeed + turbX * (0.5 + w * 2) - this.vx) * 0.04;
    this.vy += (-0.3 * w + turbY * (0.5 + w * 1.5) - this.vy) * 0.03;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  draw(ctx) {
    const fade = Math.min(this.life / 40, 1, (this.maxLife - this.life) / 60);
    const a = this.alpha * fade * (0.3 + windForce * 0.7);
    if (a < 0.01) return;
    const s = this.size * (1 + windForce * 1.5);
    if (this.type === 1) {
      // Soft smudge
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 4);
      grad.addColorStop(0, windColor(Math.min(1, 0.3 + windForce + this.hueShift), a * 0.6));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, s * 4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = windColor(Math.min(1, 0.2 + windForce * 0.9 + this.hueShift), a);
      ctx.beginPath();
      ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

const particles = [];
for (let i = 0; i < PARTICLE_N; i++) particles.push(new Particle());

// ── Wind streaks (horizontal motion blur lines) ───────────
class Streak {
  constructor() { this.reset(true); }
  reset(initial) {
    this.x = initial ? Math.random() * W : -200;
    this.y = Math.random() * H;
    this.len = 40 + Math.random() * 180;
    this.thickness = 0.4 + Math.random() * 1.2;
    this.alpha = 0.03 + Math.random() * 0.12;
    this.seed = Math.random() * 100;
  }
  update(dt) {
    const w = windForce;
    this.x += (1 + w * 9) * dt * 1.2;
    if (this.x > W + this.len + 50) this.reset(false);
  }
  draw(ctx) {
    if (windForce < 0.06) return;
    const a = this.alpha * windForce;
    if (a < 0.005) return;
    const grad = ctx.createLinearGradient(this.x - this.len, this.y, this.x, this.y);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.5, windColor(windForce * 0.7, a));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.thickness * (0.5 + windForce);
    ctx.beginPath();
    ctx.moveTo(this.x - this.len, this.y + Math.sin(time * 2 + this.seed) * windForce * 4);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
  }
}

const streaks = [];
for (let i = 0; i < 80; i++) streaks.push(new Streak());

// ── Floating fragments (released text pieces in wind) ─────
const floatingFragments = [];

function createFloatingFragment(text) {
  const el = document.createElement('div');
  el.className = 'sprite-frag';
  const preview = text.trim().replace(/\s+/g, ' ').substring(0, 50);
  el.textContent = preview.length < text.trim().length ? preview + '…' : preview;
  document.body.appendChild(el);
  const rect = el.getBoundingClientRect();
  floatingFragments.push({
    el,
    x: W * 0.3 + Math.random() * W * 0.4 - rect.width / 2,
    y: H * 0.35 + Math.random() * H * 0.2,
    vx: 0, vy: 0,
    targetY: H + 30,
    opacity: 1,
    removing: false,
    text: text.trim()
  });
}

function updateFloatingFragments(dt) {
  const w = windForce;
  for (let i = floatingFragments.length - 1; i >= 0; i--) {
    const f = floatingFragments[i];
    const turbX = Math.sin(f.y * 0.015 + time * 1.3) * 0.5;
    const turbY = Math.cos(f.x * 0.013 + time * 1.1) * 0.4;
    f.vx += ((1.2 + w * 5) * 0.7 + turbX * (0.5 + w * 2) - f.vx) * 0.02;

    // On release, gravity pulls fragments down
    const gravity = 0.15 + windForce * -0.5; // less wind = more settle
    f.vy += (gravity + turbY * 0.2 - f.vy) * 0.025;

    f.x += f.vx * dt * 1.1;
    f.y += f.vy * dt * 1.1;

    // Boundary wrap horizontally
    if (f.x > W + 120) f.x = -120;
    if (f.x < -120) f.x = W + 120;

    // Settle when reaching bottom area
    if (f.y > H - 60 && !f.removing) {
      f.removing = true;
    }

    if (f.removing) {
      f.opacity -= dt * 0.012;
      if (f.opacity <= 0) {
        f.el.remove();
        addToCluster(f.text);
        floatingFragments.splice(i, 1);
        continue;
      }
    }

    f.el.style.left = f.x + 'px';
    f.el.style.top  = f.y + 'px';
    f.el.style.opacity = f.opacity;
    const scale = 1 - (1 - f.opacity) * 0.5;
    f.el.style.transform = `scale(${scale})`;
  }
}

// ── Cluster (saved fragments at bottom) ──────────────────
function addToCluster(text) {
  savedFragments.push(text);
  const el = document.createElement('div');
  el.className = 'fragment';
  const preview = text.replace(/\s+/g, ' ').substring(0, 60);
  el.textContent = preview.length < text.length ? preview + '…' : preview;
  el.title = text;
  clusterEl.appendChild(el);
  // Limit visible fragments
  while (clusterEl.children.length > 40) {
    clusterEl.removeChild(clusterEl.firstChild);
  }
}

// ── Background rendering (distorting gradients) ───────────
function drawBackground(dt) {
  const w = windForce;
  bgCtx.clearRect(0, 0, W, H);

  // Base dark
  bgCtx.fillStyle = '#050507';
  bgCtx.fillRect(0, 0, W, H);

  // Drifting gradient layers
  const layers = 4;
  for (let i = 0; i < layers; i++) {
    const phase = time * (0.15 + i * 0.08) + i * 1.7;
    const cx = W * 0.5 + Math.sin(phase) * W * 0.25 * (1 + w * 0.6);
    const cy = H * 0.5 + Math.cos(phase * 0.7) * H * 0.2 * (1 + w * 0.5);
    const radius = (300 + i * 140) * (1 + w * 0.5);

    const shift = i / layers;
    const t = Math.min(1, w + shift * 0.4);
    const grad = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    grad.addColorStop(0, windColor(t, 0.06 + w * 0.08));
    grad.addColorStop(0.5, windColor(t * 0.6, 0.025 + w * 0.04));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, W, H);
  }

  // Heat-haze horizontal bands (stronger with wind)
  if (w > 0.08) {
    for (let i = 0; i < 6; i++) {
      const y = H * (0.15 + i * 0.13) + Math.sin(time * 0.6 + i * 2.3) * 30 * w;
      const grad = bgCtx.createLinearGradient(0, y, W, y);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.5, windColor(w * 0.5, 0.02 * w));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = grad;
      bgCtx.fillRect(0, y - 20, W, 40);
    }
  }
}

// ── Main loop ─────────────────────────────────────────────
let lastTime = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 16.67, 3); // normalize to ~60fps
  lastTime = now;
  time += dt * 0.05;

  // Smooth wind toward target
  const windDelta = (targetWind - windForce) * 0.06;
  windForce += windDelta;
  if (windForce < 0.001) windForce = 0;
  if (windForce > 0.999) windForce = 1;

  // Update UI
  const pct = Math.round(windForce * 100);
  gaugeFill.style.width = pct + '%';
  gaugeVal.textContent = pct;
  if (windForce > 0.04) gaugeWrap.classList.add('active');
  else gaugeWrap.classList.remove('active');
  if (windForce > 0.15) releaseBtn.classList.add('winding');
  else releaseBtn.classList.remove('winding');

  // Textarea glow follows wind
  if (windForce > 0.08) {
    textarea.style.borderColor = windColor(windForce * 0.7, 0.25);
    textarea.style.boxShadow = `0 0 ${20 + windForce * 50}px ${windColor(windForce, 0.12)}`;
  } else {
    textarea.style.borderColor = 'rgba(255,255,255,0.08)';
    textarea.style.boxShadow = 'none';
  }

  // Draw background (distorts with wind)
  drawBackground(dt);

  // Update & draw FX canvas
  fxCtx.clearRect(0, 0, W, H);

  // Streaks behind particles
  streaks.forEach(s => { s.update(dt); s.draw(fxCtx); });

  // Particles
  particles.forEach(p => { p.update(dt); p.draw(fxCtx); });

  // Wind vibration overlay (stronger with high wind)
  if (windForce > 0.2) {
    fxCtx.fillStyle = `rgba(0,0,0,${windForce * 0.03})`;
    fxCtx.fillRect(0, 0, W, H);
  }

  // Floating fragments
  updateFloatingFragments(dt);

  // CSS blur on background + displacement for heat effect
  if (windForce > 0.05) {
    bgCanvas.style.filter = `blur(${windForce * 2.5}px) saturate(${1 + windForce * 0.8})`;
  } else {
    bgCanvas.style.filter = 'none';
  }

  // FX canvas slight displacement via transform for shake
  if (windForce > 0.3) {
    const shake = windForce * 1.8;
    fxCanvas.style.transform = `translate(${(Math.random()-0.5)*shake}px, ${(Math.random()-0.5)*shake}px)`;
  } else {
    fxCanvas.style.transform = 'none';
  }
}

// ── Events ────────────────────────────────────────────────
function updateFromText() {
  const len = textarea.value.length;
  targetWind = Math.min(1, len / MAX_CHARS);
}

textarea.addEventListener('input', updateFromText);

function release() {
  const text = textarea.value.trim();
  if (!text) return;

  // Spawn floating fragments (split long text into pieces)
  const words = text.split(/\s+/).filter(w => w);
  if (words.length <= 4) {
    createFloatingFragment(text);
  } else {
    // Split into 2-4 chunks for visual interest
    const chunks = 2 + Math.floor(Math.random() * 3);
    const chunkSize = Math.ceil(words.length / chunks);
    for (let i = 0; i < words.length; i += chunkSize) {
      createFloatingFragment(words.slice(i, i + chunkSize).join(' '));
    }
  }

  // Clear and calm
  textarea.value = '';
  targetWind = 0;
  calmTimer = 1;

  // Hide hint after first save
  if (savedFragments.length === 0) {
    hint.style.opacity = '0';
    setTimeout(() => { hint.textContent = 'Fragments gather below'; hint.style.opacity = '1'; }, 800);
    setTimeout(() => { hint.style.opacity = '0'; }, 4500);
  }
}

releaseBtn.addEventListener('click', release);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    e.preventDefault();
    release();
  }
});

// ── Kick off ──────────────────────────────────────────────
requestAnimationFrame(loop);

// Initial ambient: a few particles active so screen isn't dead
particles.forEach(p => { p.y = Math.random() * H; });

})();
</script>
</body>
</html>
