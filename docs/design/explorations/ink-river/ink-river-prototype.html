<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鸿蒙 · The River</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=Caveat:wght@400;600&display=swap');

:root {
  --river-1: #0a1628;
  --river-2: #0d1f3c;
  --river-3: #122a4a;
  --water: rgba(59, 130, 246, 0.08);
  --foam: rgba(255,255,255,0.06);
  --glow: rgba(147, 197, 253, 0.3);
  --gold: #fbbf24;
  --text-bright: rgba(255,255,255,0.95);
  --text-mid: rgba(255,255,255,0.6);
  --text-dim: rgba(255,255,255,0.25);
  --text-faint: rgba(255,255,255,0.08);
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'Literata', serif; color: var(--text-bright); background: var(--river-1); -webkit-font-smoothing: antialiased; cursor: default; }

/* === RIVER BACKGROUND === */
#river {
  position: fixed; inset: 0;
  background:
    linear-gradient(180deg,
      #050d1a 0%,
      #0a1628 15%,
      #0d1f3c 30%,
      #122a4a 50%,
      #0d1f3c 70%,
      #0a1628 85%,
      #050d1a 100%
    );
  overflow: hidden;
}

/* Water surface caustics */
#river::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(180deg,
      transparent 0px,
      rgba(100, 180, 255, 0.02) 1px,
      transparent 2px,
      transparent 80px
    ),
    repeating-linear-gradient(170deg,
      transparent 0px,
      rgba(100, 180, 255, 0.015) 1px,
      transparent 3px,
      transparent 120px
    );
  animation: causticFlow 12s linear infinite;
}
@keyframes causticFlow {
  0% { transform: translateY(0); }
  100% { transform: translateY(80px); }
}

/* Ambient light from surface */
#river::after {
  content: '';
  position: absolute;
  top: -100%;
  left: 0; right: 0;
  height: 100%;
  background: radial-gradient(ellipse at 50% 0%, rgba(120, 180, 255, 0.06) 0%, transparent 60%);
  pointer-events: none;
}

/* lamp/spotlight that follows cursor */
#spotlight {
  position: fixed;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(147, 197, 253, 0.12) 0%, transparent 70%);
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: left 0.3s, top 0.3s;
  z-index: 2;
}

/* === RIVER CONTENT (scrollable) === */
#river-content {
  position: relative;
  z-index: 5;
  height: 100%;
  overflow-y: auto;
  scroll-behavior: smooth;
  padding: 60px 0 200px;
}

/* inner width constraints */
#river-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 40px;
  position: relative;
}

/* === SECTIONS IN THE RIVER === */
.section {
  position: relative;
  margin-bottom: 28px;
  transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  cursor: pointer;
}

.section:hover {
  transform: translateX(4px);
}

/* Ripple on hover */
.section::before {
  content: '';
  position: absolute;
  inset: -8px -16px;
  border-radius: 4px;
  background: radial-gradient(ellipse at center, rgba(147, 197, 253, 0.04) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
.section:hover::before {
  opacity: 1;
}

/* Time marker (left margin) */
.time-marker {
  position: absolute;
  left: -48px;
  top: 4px;
  font-size: 10px;
  color: var(--text-mid);
  font-family: 'Inter', sans-serif;
  opacity: 0.4;
  letter-spacing: 0.03em;
  transition: opacity 0.3s;
}
.section:hover .time-marker { opacity: 0.8; }

/* Content blocks */
.content-block {
  position: relative;
  background: rgba(255,255,255,0.02);
  border-radius: 3px;
  padding: 16px 20px;
  margin-bottom: 14px;
  transition: all 0.3s;
  border-left: 2px solid transparent;
  overflow: hidden;
}

.section:hover .content-block {
  background: rgba(255,255,255,0.04);
  border-left-color: var(--glow);
}

/* Selected state */
.section.active .content-block {
  background: rgba(147, 197, 253, 0.06);
  border-left-color: var(--gold);
  box-shadow: 0 0 24px rgba(251, 191, 36, 0.05);
}

/* Text */
.content-block p {
  font-size: 15px;
  line-height: 1.8;
  margin-bottom: 6px;
  transition: color 0.4s;
}

/* New text - bright and large */
.section.new .content-block p {
  font-size: 16px;
  color: var(--text-bright);
}

/* Old text - smaller, dimmer, more transparent */
.section.old .content-block p {
  font-size: 14px;
  color: var(--text-mid);
}

/* Ancient text - very faint */
.section.ancient .content-block p {
  font-size: 12px;
  color: var(--text-dim);
}

/* Section title */
.section-title {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  color: var(--text-mid);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color 0.3s;
}
.section:hover .section-title { color: var(--text-bright); }
.section.active .section-title { color: var(--gold); }

/* === EDITABLE WRITING AREA (bottom of river) === */
#writing-zone {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  height: 200px;
  background: linear-gradient(to top,
    var(--river-1) 0%,
    rgba(10, 22, 40, 0.98) 40%,
    rgba(10, 22, 40, 0.8) 70%,
    transparent 100%
  );
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 24px;
  pointer-events: none;
}
#writing-inner {
  pointer-events: all;
  width: 100%;
  max-width: 600px;
  padding: 0 40px;
  position: relative;
}
#editor {
  width: 100%;
  height: 100px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 14px 18px;
  font-family: 'Literata', serif;
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-bright);
  outline: none;
  resize: none;
  transition: all 0.3s;
}
#editor:focus {
  background: rgba(255,255,255,0.07);
  border-color: var(--glow);
  box-shadow: 0 0 20px rgba(147, 197, 253, 0.1);
}
#editor::placeholder {
  color: var(--text-dim);
  font-style: italic;
}

/* Writing caret */
#editor:focus {
  caret-color: var(--gold);
}

/* Submit hint */
.write-hint {
  position: absolute;
  bottom: -22px; right: 40px;
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'Inter', sans-serif;
  letter-spacing: 0.03em;
}

/* === ACTION PANEL (overlays) === */
#actions {
  position: fixed;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 8px;
  z-index: 1000;
}
.action-btn {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-mid);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}
.action-btn:hover {
  background: rgba(255,255,255,0.12);
  color: var(--text-bright);
  border-color: rgba(255,255,255,0.15);
  transform: translateY(-1px);
}
.action-btn.primary {
  background: rgba(251, 191, 36, 0.15);
  border-color: var(--gold);
  color: var(--gold);
}
.action-btn.primary:hover {
  background: rgba(251, 191, 36, 0.25);
}

/* === OVERLAYS === */
.overlay {
  position: fixed; inset: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
.overlay.show { opacity: 1; pointer-events: auto; }

#relics-overlay { background: rgba(5, 13, 26, 0.92); backdrop-filter: blur(8px); }
.relic-close { position: absolute; top: 22px; right: 28px; font-size: 12px; color: var(--text-mid); cursor: pointer; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--text-faint); transition: all 0.2s; }
.relic-close:hover { color: var(--text-bright); border-color: var(--text-dim); }
#relic-phrase { font-family: 'Caveat', cursive; font-size: 36px; color: var(--gold); margin-bottom: 28px; }
.relic-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 90vw; }
.relic-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 18px 20px;
  cursor: pointer;
  transition: all 0.3s;
  animation: fadeUp 0.4s calc(var(--i) * 80ms) both;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.relic-card:hover { background: rgba(255,255,255,0.07); border-color: var(--gold); }
.relic-card .rc-name { font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; color: var(--text-bright); margin-bottom: 10px; }
.relic-card .rc-body { font-size: 12.5px; line-height: 1.7; color: var(--text-mid); white-space: pre-wrap; font-family: 'Literata', serif; }
.relic-card .rc-body mark { background: rgba(251, 191, 36, 0.2); color: #fff; }

/* TIME BANDS overlay */
#bands-overlay { background: rgba(5, 13, 26, 0.95); backdrop-filter: blur(8px); padding: 60px 40px; align-items: flex-start; overflow-y: auto; }
.bands-head { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; margin-bottom: 24px; }
.bands-head h2 { font-family: 'Caveat', cursive; font-size: 28px; color: var(--text-bright); font-weight: 400; }
.bands-close { font-size: 12px; color: var(--text-mid); cursor: pointer; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--text-faint); transition: all 0.2s; }
.bands-close:hover { color: var(--text-bright); }
.band-list { display: flex; flex-direction: column; gap: 0; max-width: 600px; width: 100%; }
.band-row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; transition: background 0.3s; }
.band-row:hover { background: rgba(255,255,255,0.02); }
.band-time { width: 76px; font-size: 11px; color: var(--text-mid); font-family: 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.band-bar { width: 5px; height: 28px; border-radius: 3px; flex-shrink: 0; }
.band-text { font-size: 14px; line-height: 1.65; color: var(--text-bright); font-family: 'Literata', serif; }

/* Resonance highlight on sections */
@keyframes ripple {
  0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.3); }
  70% { box-shadow: 0 0 0 16px rgba(251, 191, 36, 0); }
  100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
}
.section.resonating .content-block {
  border-left-color: var(--gold);
  animation: ripple 2s ease-out;
}

/* Scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

/* Mobile */
@media (max-width: 700px) {
  #river-inner { padding: 0 20px; }
  .time-marker { display: none; }
  #writing-inner { padding: 0 20px; }
  .relic-grid { grid-template-columns: 1fr; }
  #actions { top: auto; bottom: 220px; right: 12px; flex-direction: column; }
}
</style>
</head>
<body>

<div id="river">
  <div id="spotlight"></div>
  <div id="river-content">
    <div id="river-inner">

      <!-- Dynamic sections rendered by JS -->

    </div>
  </div>
</div>

<!-- WRITING ZONE (bottom) -->
<div id="writing-zone">
  <div id="writing-inner">
    <textarea id="editor" placeholder="把你想写的投入河中… 新的水会浮起来，自动归类到相关的段落"></textarea>
    <div class="write-hint">按住 Enter 3 秒 → 投入河中 · Esc → 清空</div>
  </div>
</div>

<!-- ACTION BUTTONS -->
<div id="actions">
  <button class="action-btn primary" onclick="submitToRiver()">💧 投入河中</button>
  <button class="action-btn" onclick="openBands()">⏰ 时间带</button>
  <button class="action-btn" onclick="openRelics()">🔮 墨迹</button>
  <button class="action-btn" onclick="jumpToBottom()">⏷ 顺流</button>
  <button class="action-btn" onclick="jumpToTop()">⏴ 逆流</button>
</div>

<!-- INK RELICS OVERLAY -->
<div id="relics-overlay" class="overlay">
  <div class="relic-close" onclick="closePanel('relics-overlay')">关闭 (Esc)</div>
  <div id="relic-phrase">侧栏</div>
  <div class="relic-grid" id="relic-grid"></div>
</div>

<!-- TIME BANDS OVERLAY -->
<div id="bands-overlay" class="overlay">
  <div class="bands-head">
    <h2>Time Bands</h2>
    <div class="bands-close" onclick="closePanel('bands-overlay')">关闭 (Esc)</div>
  </div>
  <div class="band-list" id="band-list"></div>
</div>

<script>
// === DATA: ALL WRITING ===
const CONTENT = [
  {
    id: 'd1',
    title: '设计哲学.md',
    hoursAgo: 2,
    paragraphs: [
      '设计的本质不是解决问题，而是发现真正的命题。每次我坐在桌前，最先做的不是画草图，而是问自己：我真正要回答的问题是什么？',
    ]
  },
  {
    id: 'd2',
    title: '数字极简.md',
    hoursAgo: 12,
    paragraphs: [
      '注意力经济的核心悖论：我们以为是"工具使用我们"，实际是"我们喂养了注意力经济"。设计的责任不是让用户上瘾，是帮助他们建立清晰的注意力边界。',
    ]
  },
  {
    id: 'd3',
    title: '周会记录-0703.md',
    hoursAgo: 6,
    paragraphs: [
      '讨论了 Q3 架构方向。PM 提出一个需求：操作面板看完列表应回到之前滚动位置。深层问题是"操作"与"阅读"不只是模式切换。',
    ]
  },
  {
    id: 'd4',
    title: '设计咨询备忘.md',
    hoursAgo: 28,
    paragraphs: [
      '注意：区分"可诉说的需求"和"沉默需求"。Linear + Notion 混合路线。安全感来自确定感：我知道东西没丢。去掉侧栏等于去掉安全毯。',
    ]
  },
  {
    id: 'd5',
    title: 'Resonance 算法笔记.md',
    hoursAgo: 40,
    paragraphs: [
      'BM25 实现细节 + 反向链接检测。置信度不够时缩小字号，而不是藏起来。文档之间的连接是活的。',
    ]
  },
  {
    id: 'd6',
    title: 'attention.md',
    hoursAgo: 72,
    paragraphs: [
      '注意力是唯一的货币。注意力的设计影响决策质量。注意力的经济学公式：Attention=f(irrelevance)。',
    ]
  },
  {
    id: 'd7',
    title: 'the-desk-concept.md',
    hoursAgo: 96,
    paragraphs: [
      'The Desk 书桌层 — 空间记忆模型。位置=意义。最近活跃=伸手可及。稍远记忆=半透明在远角。最多 7±2 个。同一文档每次在同一位置。',
    ]
  },
];

// Ink Relics
const RELICS = [
  {
    phrase: '注意力',
    docs: [
      { name: '数字极简.md', text: '注意力经济的核心悖论:\n我们以为是"工具使用我们"\n实际是我们喂养了注意力经济' },
      { name: 'attention.md', text: '注意力是唯一的货币。\n注意力的设计影响决策质量' },
    ]
  },
  {
    phrase: '设计',
    docs: [
      { name: '设计哲学.md', text: '设计的本质不是解决问题\n而是发现真正的命题' },
      { name: '设计咨询备忘.md', text: '"Linear + Notion 混合路线。"\n保留温暖感' },
    ]
  },
  {
    phrase: '侧栏',
    docs: [
      { name: '无侧栏设计方案.md', text: '去掉侧栏\n不能只做减法' },
      { name: 'Resonance算法笔记.md', text: '"侧栏的消亡\n需要等价物的出现"' },
    ]
  },
];

// Time bands
const BANDS = [
  { t: '6:42 AM', c: 'rgba(147,197,253,0.20)', x: '开始写"设计哲学.md" · 4 段' },
  { t: '6:58 AM', c: 'rgba(147,197,253,0.07)', x: '暂停 · 喝咖啡' },
  { t: '7:12 AM', c: 'rgba(147,197,253,0.24)', x: '密集写 Resonance 段落 · +220 字' },
  { t: '7:44 AM', c: 'rgba(147,197,253,0.05)', x: '切到书桌整理 · 重排了 3 篇' },
  { t: '8:02 AM', c: 'rgba(147,197,253,0.17)', x: '回到 Surface · 改前 2 段' },
  { t: '9:20 AM', c: 'rgba(147,197,253,0.30)', x: '冲刺写完 · 反复打磨末段' },
  { t: '现在',    c: 'transparent', x: '你在水里' },
];

// STATE
let sectionOrder = [...CONTENT.map(c => c.id)]; // most recent first
let nextSectionId = 'd8';

// === RENDER ===
function getAgeClass(hoursAgo) {
  if (hoursAgo < 6) return 'new';
  if (hoursAgo < 48) return 'old';
  return 'ancient';
}

function fmtTime(hoursAgo) {
  if (hoursAgo < 1) return '刚刚';
  if (hoursAgo < 24) return hoursAgo + ' 小时前';
  return Math.floor(hoursAgo / 24) + ' 天前';
}

function renderRiver() {
  const container = document.getElementById('river-inner');
  container.innerHTML = '';
  
  sectionOrder.forEach(id => {
    const c = CONTENT.find(x => x.id === id);
    if (!c) return;
    
    const el = document.createElement('div');
    el.className = 'section ' + getAgeClass(c.hoursAgo);
    el.id = 'sec-' + c.id;
    
    const timeMarker = document.createElement('div');
    timeMarker.className = 'time-marker';
    timeMarker.textContent = fmtTime(c.hoursAgo);
    el.appendChild(timeMarker);
    
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = c.title.replace('.md', '');
    el.appendChild(title);
    
    const block = document.createElement('div');
    block.className = 'content-block';
    c.paragraphs.forEach(p => {
      const pEl = document.createElement('p');
      pEl.textContent = p;
      block.appendChild(pEl);
    });
    el.appendChild(block);
    
    // Click triggers resonance
    el.addEventListener('click', (e) => {
      if (el.classList.contains('active')) {
        // Already active, find resonance
        triggerResonance(c.id);
      } else {
        selectSection(c.id);
      }
    });
    
    container.appendChild(el);
  });
  
  // scroll to active or stay at top
  if (document.querySelector('.section.active')) {
    // keep scroll position
  } else {
    // scroll a bit to show the newest
  }
}

function selectSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('sec-' + id);
  if (el) el.classList.add('active');
}

function triggerResonance(id) {
  const c = CONTENT.find(x => x.id === id);
  if (!c) return;
  
  // find other paragraphs sharing concepts
  const words = c.paragraphs.join(' ').split(/\s+/).filter(w => w.length > 1);
  const resonatedIds = new Set();
  
  CONTENT.forEach(other => {
    if (other.id === id) return;
    const text = other.paragraphs.join(' ');
    if (words.some(w => text.includes(w))) {
      resonatedIds.add(other.id);
    }
  });
  
  // animate them
  resonatedIds.forEach(rid => {
    const el = document.getElementById('sec-' + rid);
    if (el) {
      el.classList.add('resonating');
      setTimeout(() => el.classList.remove('resonating'), 2000);
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
  
  // If nothing resonated, just re-mark active
  if (resonatedIds.size === 0) {
    selectSection(id);
  }
}

// === SUBMIT TO RIVER ===
function submitToRiver() {
  const text = document.getElementById('editor').value.trim();
  if (!text) return;
  
  // Split into paragraphs
  const paragraphs = text.split('\n').filter(l => l.trim());
  
  // Find if any existing section shares significant words
  const allWords = text.split(/[\s,，。；："'？\n]+/).filter(w => w.length > 1);
  let bestMatch = null;
  let bestScore = 0;
  
  CONTENT.forEach(c => {
    const cText = c.paragraphs.join(' ');
    const score = allWords.filter(w => cText.includes(w)).length;
    if (score > bestScore && score >= 2) {
      bestScore = score;
      bestMatch = c.id;
    }
  });
  
  if (bestMatch) {
    // Append to existing section
    const target = CONTENT.find(c => c.id === bestMatch);
    target.paragraphs.push(...paragraphs);
    target.hoursAgo = Math.min(target.hoursAgo, 0); // make it newer
    // Move to top
    sectionOrder = sectionOrder.filter(id => id !== bestMatch);
    sectionOrder.unshift(bestMatch);
  } else {
    // Create new section
    const newSection = {
      id: nextSectionId++,
      title: '新段落 ' + (nextSectionId - 8),
      hoursAgo: 0,
      paragraphs: paragraphs,
    };
    CONTENT.unshift(newSection);
    sectionOrder.unshift(newSection.id);
  }
  
  document.getElementById('editor').value = '';
  renderRiver();
  jumpToTop();
}

// === PANELS ===
function openBands() {
  const list = document.getElementById('band-list');
  list.innerHTML = BANDS.map(b => `
    <div class="band-row">
      <div class="band-time">${b.t}</div>
      <div class="band-bar" style="background:${b.c}"></div>
      <div class="band-text">${b.x}</div>
    </div>
  `).join('');
  document.getElementById('bands-overlay').classList.add('show');
}

function openRelics() {
  const grid = document.getElementById('relic-grid');
  const r = RELICS[0];
  document.getElementById('relic-phrase').textContent = r.phrase;
  grid.innerHTML = r.docs.map((d, i) => {
    const text = d.text.replace(new RegExp(r.phrase, 'g'), '<mark>$&</mark>');
    return `<div class="relic-card" style="--i:${i}"><div class="rc-name">${d.name}</div><div class="rc-body">${text}</div></div>`;
  }).join('');
  document.getElementById('relics-overlay').classList.add('show');
}

function closePanel(id) {
  document.getElementById(id).classList.remove('show');
}

// === JUMP ===
function jumpToBottom() {
  document.getElementById('river-content').scrollTo({ top: 0, behavior: 'smooth' });
}
function jumpToTop() {
  document.getElementById('river-content').scrollTo({
    top: document.getElementById('river-content').scrollHeight,
    behavior: 'smooth'
  });
}

// === SPOTLIGHT FOLLOWS CURSOR ===
document.addEventListener('mousemove', (e) => {
  const s = document.getElementById('spotlight');
  s.style.left = e.clientX + 'px';
  s.style.top = e.clientY + 'px';
});

// === KEYBOARD ===
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closePanel('relics-overlay');
    closePanel('bands-overlay');
    const ed = document.getElementById('editor');
    if (document.activeElement === ed) ed.blur();
  }
  if (e.key === 't' && !e.metaKey && !e.ctrlKey && document.activeElement !== document.getElementById('editor')) {
    e.preventDefault();
    document.getElementById('bands-overlay').classList.contains('show') ? closePanel('bands-overlay') : openBands();
  }
});

// === INIT ===
renderRiver();
</script>
</body>
</html>
