<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无侧栏导航原型 v2 — 五场景覆盖</title>
<style>
:root {
  --paper: #fcfaf6; --paper-warm: #f7f3ee; --desk: #ede8e2; --dock: #e8e2d8;
  --ink: rgba(0,0,0,0.82); --ink-soft: rgba(0,0,0,0.55); --ink-faint: rgba(0,0,0,0.16);
  --ink-res: rgba(0,0,0,0.32); --accent: #8b7355; --warm: #c8965a; --radius: 10px;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.03); --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.10);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; font-family: 'Inter', 'PingFang SC', sans-serif;
  color: var(--ink); background: var(--paper); overflow: hidden;
  font-size: 14px; cursor: default;
}

/* LAYOUT */
.stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
}

/* BOOT */
#boot { z-index: 1000; background: var(--paper); pointer-events: all; }
#boot.gone { opacity: 0; pointer-events: none !important; }
.boot-inner { max-width: 440px; padding: 30px; }
.boot-line {
  display: block; font-family: 'Literata', serif; font-size: 15px;
  color: var(--ink-soft); line-height: 1.9; opacity: 0; transform: translateY(12px);
  animation: bootIn 0.6s ease-out forwards;
}
.boot-line:nth-child(2) { animation-delay: 0.4s; }
.boot-line:nth-child(3) { animation-delay: 0.8s; font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
@keyframes bootIn { to { opacity: 1; transform: translateY(0); } }
kbd {
  display: inline-block; background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.06);
  border-radius: 4px; padding: 1px 6px; font-size: 10px; font-family: 'JetBrains Mono', monospace;
  color: var(--ink-soft); margin: 0 2px;
}

/* SURFACE */
#surface {
  flex-direction: column; padding: 0; background: var(--paper);
  background-image: radial-gradient(ellipse at 20% 10%, rgba(180,160,130,0.03) 0%, transparent 50%);
  transition: padding-left 0.4s var(--ease), opacity 0.3s, transform 0.3s;
}
#surface.dimed { opacity: 0.25; transform: scale(0.88); pointer-events: none; }
#surface.dock-open { padding-left: 280px; }

#edge-top { position: absolute; top: 0; left: 0; right: 0; height: 8px; z-index: 200; }
#edge-top:hover ~ #toolbar { opacity: 1; transform: translateY(0); }

#toolbar {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; gap: 18px;
  height: 36px; background: rgba(252,250,246,0.95); border-bottom: 1px solid var(--ink-faint);
  font-size: 12px; color: var(--ink-soft); opacity: 0; transform: translateY(-8px);
  transition: opacity 0.25s, transform 0.25s; z-index: 199;
}
#toolbar:hover { opacity: 1; transform: translateY(0); }
#toolbar span { cursor: pointer; padding: 3px 10px; border-radius: 4px; transition: background 0.2s; }
#toolbar span:hover { background: var(--paper-warm); }

/* TABS */
#tabs {
  display: flex; gap: 2px; padding: 0 40px; height: 32px;
  width: 100%; max-width: 680px; align-items: flex-end;
}
#tabs .tab {
  height: 28px; padding: 0 14px; border-radius: 6px 6px 0 0;
  font-size: 12px; color: var(--ink-soft); cursor: pointer;
  display: flex; align-items: center; gap: 8px; transition: background 0.15s;
  background: transparent; white-space: nowrap;
}
#tabs .tab:hover { background: var(--paper-warm); }
#tabs .tab.active { background: rgba(139,115,85,0.08); color: var(--ink); font-weight: 500; }
#tabs .tab-close { opacity: 0; transition: opacity 0.15s; font-size: 14px; }
#tabs .tab:hover .tab-close { opacity: 0.5; }
#tabs .tab-new {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 4px; color: var(--ink-faint); transition: background 0.15s, color 0.15s;
}
#tabs .tab-new:hover { background: var(--paper-warm); color: var(--ink-soft); }

/* WRITER */
#writer {
  width: 100%; max-width: 600px; height: calc(100% - 32px);
  display: flex; flex-direction: column; padding: 30px 40px 50px; position: relative;
}
.doc-meta { font-size: 11px; color: var(--ink-faint); margin-bottom: 20px; }
.doc-meta .doc-name { font-weight: 500; color: var(--ink-soft); }

#editor {
  flex: 1; overflow-y: auto; resize: none; border: none; outline: none;
  background: transparent; width: 100%; min-height: 300px;
  font-family: 'Literata', 'PingFang SC', serif; font-size: 16px;
  line-height: 1.85; color: var(--ink); caret-color: var(--accent); cursor: text;
}
#editor p { margin-bottom: 14px; }
.status {
  position: absolute; bottom: 12px; left: 40px; right: 40px;
  display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint);
}

/* RESONANCE */
#resonance {
  position: absolute; right: -240px; top: 50%; transform: translateY(-50%);
  width: 220px; opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 10;
}
#resonance.show { opacity: 1; pointer-events: auto; }
.res-item {
  border-left: 2px solid var(--ink-faint); padding: 6px 12px; margin-bottom: 12px;
  cursor: pointer; transition: border-color 0.25s;
}
.res-item:hover { border-left-color: var(--warm); }
.res-item .quote { font-family: 'Literata', serif; font-size: 11.5px; line-height: 1.55; color: var(--ink-res); font-style: italic; }
.res-item .src { font-size: 10px; color: var(--ink-faint); margin-top: 4px; }
.res-item .src .label { color: var(--warm); }

/* SPLIT VIEW */
#split-container {
  display: flex; width: 100%; max-width: 900px; height: calc(100% - 32px); position: absolute;
  top: 32px; left: 0; right: 0; pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
}
#split-container.active { opacity: 1; pointer-events: auto; }
.split-pane {
  flex: 1; display: flex; flex-direction: column; padding: 30px 25px 50px;
  border-right: 1px solid rgba(0,0,0,0.05); position: relative;
}
.split-pane:last-child { border-right: none; }
.split-pane .split-editor {
  flex: 1; overflow-y: auto; resize: none; border: none; outline: none; background: transparent;
  font-family: 'Literata', serif; font-size: 15px; line-height: 1.8; color: var(--ink); cursor: text;
}
.split-close {
  position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--ink-faint);
  cursor: pointer; padding: 2px 6px; border-radius: 3px;
}
.split-close:hover { color: var(--ink-soft); background: rgba(0,0,0,0.03); }

/* BOTTOM STRIP */
.strip {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.96);
  border: 1px solid rgba(0,0,0,0.1); border-radius: 20px; padding: 8px 16px;
  font-size: 11.5px; color: var(--ink-soft); backdrop-filter: blur(12px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.1); z-index: 999; max-width: 94vw;
  flex-wrap: wrap; justify-content: center; transition: all 0.25s;
}
.strip .sep { width: 1px; height: 10px; background: var(--ink-faint); opacity: 0.3; }
.strip-btn {
  background: none; border: none; font: inherit; color: inherit; cursor: pointer;
  padding: 4px 10px; border-radius: 4px; transition: background 0.15s; white-space: nowrap;
}
.strip-btn:hover { background: var(--paper-warm); color: var(--ink); }

/* DOCK */
#dock {
  position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--dock);
  border-right: 1px solid rgba(0,0,0,0.06); z-index: 150; display: flex; flex-direction: column;
  transform: translateX(-100%); transition: transform 0.4s var(--ease);
}
#dock.open { transform: translateX(0); }
.dock-tabs { display: flex; border-bottom: 1px solid rgba(0,0,0,0.06); }
.dock-tab {
  flex: 1; padding: 10px 8px; text-align: center; font-size: 11px; font-weight: 500;
  color: var(--ink-soft); cursor: pointer; transition: background 0.15s; letter-spacing: 0.02em;
}
.dock-tab:hover { background: rgba(0,0,0,0.02); }
.dock-tab.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }

.dock-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid rgba(0,0,0,0.04);
}
.dock-title { font-size: 10px; font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }

#dock .dock-btn {
  background: none; border: none; cursor: pointer; width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center; border-radius: 4px;
  color: var(--ink-faint); font-size: 13px; transition: background 0.15s, color 0.15s;
}
#dock .dock-btn:hover { background: rgba(0,0,0,0.04); color: var(--ink-soft); }

.dock-list { flex: 1; overflow-y: auto; padding: 6px; }
.dock-item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: background 0.15s;
}
.dock-item:hover { background: rgba(0,0,0,0.03); }
.dock-item.current { background: rgba(139,115,85,0.08); }
.dock-item-name { font-size: 12.5px; font-weight: 500; color: var(--ink); margin-bottom: 3px; }
.dock-item-preview { font-family: 'Literata', serif; font-size: 11px; color: var(--ink-soft); opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-item-meta { font-size: 9.5px; color: var(--ink-faint); display: flex; justify-content: space-between; margin-top: 3px; }

/* OMNI-SEARCH */
#omni-overlay {
  position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.2);
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 15vh;
}
#omni-overlay.show { opacity: 1; pointer-events: auto; }
#omni {
  width: 100%; max-width: 600px; background: var(--paper);
  border-radius: 14px; box-shadow: var(--shadow-lg), 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid rgba(0,0,0,0.08); overflow: hidden; transform: translateY(-8px);
  transition: transform 0.25s;
}
#omni-overlay.show #omni { transform: translateY(0); }

.omni-mode-bar {
  display: flex; gap: 0; border-bottom: 1px solid rgba(0,0,0,0.05);
}
.omni-mode {
  padding: 10px 18px; font-size: 11px; font-weight: 500; cursor: pointer;
  color: var(--ink-soft); transition: color 0.15s, background 0.15s; letter-spacing: 0.02em;
}
.omni-mode:hover { background: var(--paper-warm); }
.omni-mode.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }

.omni-input-wrap { display: flex; align-items: center; padding: 14px 16px; gap: 10px; }
.omni-input-wrap .prompt { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent); font-weight: 500; }
.omni-input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ink); }

.omni-results { max-height: 280px; overflow-y: auto; }
.omni-result {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  cursor: pointer; transition: background 0.1s;
}
.omni-result:hover, .omni-result.active { background: rgba(139,115,85,0.07); }
.omni-result-icon { width: 28px; height: 28px; border-radius: 6px; background: rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.omni-result-text { flex: 1; min-width: 0; }
.omni-result-title { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.omni-result-snippet { font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; font-family: 'Literata', serif; }
.omni-result-meta { font-size: 10px; color: var(--ink-faint); text-align: right; flex-shrink: 0; }
.omni-empty { padding: 20px; text-align: center; color: var(--ink-faint); font-size: 12px; }

.omni-command {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background 0.1s;
}
.omni-command:hover, .omni-command.active { background: rgba(139,115,85,0.07); }
.omni-cmd-icon { width: 28px; height: 28px; border-radius: 6px; background: rgba(139,115,85,0.1); display: flex; align-items: center; justify-content: center; font-size: 13px; }
.omni-cmd-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.omni-cmd-desc { font-size: 10.5px; color: var(--ink-faint); }

.omni-hint {
  padding: 8px 16px; border-top: 1px solid rgba(0,0,0,0.04);
  display: flex; gap: 16px; font-size: 10px; color: var(--ink-faint);
}

/* READING COMPLETION */
#reading {
  background: var(--paper); opacity: 0; pointer-events: none;
}
#reading.show { opacity: 1; pointer-events: auto; }
.rc-container { display: flex; flex-direction: column; align-items: center; max-width: 700px; width: 90%; }
.rc-phase { width: 100%; transition: all 0.5s var(--ease); }

.rc-box { text-align: center; margin-bottom: 36px; }
.rc-box .rc-title { font-family: 'Literata', serif; font-size: 24px; color: var(--ink); margin-bottom: 6px; }
.rc-box .rc-time { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.04em; }

.rc-ink-mark {
  position: fixed; bottom: 60px; right: 40px; font-family: 'Literata', serif;
  font-size: 11px; color: var(--ink-faint); opacity: 0; transition: opacity 0.8s;
}
.rc-ink-mark.show { opacity: 1; }

.rc-suggestions {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; gap: 20px; justify-content: center; padding: 0 20px 20px;
  opacity: 0; transform: translateY(20px); transition: all 0.6s var(--ease);
  background: linear-gradient(to top, var(--paper) 60%, transparent);
}
.rc-suggestions.show { opacity: 1; transform: translateY(0); padding-bottom: 40px; }

.rc-card {
  width: 220px; background: rgba(255,255,255,0.92); border: 1px solid var(--ink-faint);
  border-radius: 10px; padding: 16px 18px; text-align: left; cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s; backdrop-filter: blur(8px);
}
.rc-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.rc-card .rc-type { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warm); margin-bottom: 8px; }
.rc-card .rc-quote { font-family: 'Literata', serif; font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); font-style: italic; }

.rc-progress {
  width: 200px; height: 2px; background: var(--ink-faint); border-radius: 1px; margin: 20px 0;
  opacity: 0; transition: opacity 0.3s;
}
.rc-progress.show { opacity: 1; }
.rc-progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; }

.rc-exit {
  position: fixed; top: 20px; right: 24px; font-size: 11px; color: var(--ink-faint);
  cursor: pointer; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--ink-faint);
  transition: all 0.2s; opacity: 0;
}
.rc-exit.show { opacity: 1; }
.rc-exit:hover { color: var(--ink-soft); border-color: var(--ink-soft); }

/* DESK */
#desk {
  background: var(--desk);
  background-image: radial-gradient(ellipse at 50% 50%, rgba(139,119,90,0.04) 0%, transparent 70%);
  opacity: 0; pointer-events: none; transform: scale(1.05);
}
#desk.show { opacity: 1; pointer-events: auto; transform: scale(1); }
.desk-inner { width: 100%; max-width: 820px; height: 85%; display: flex; flex-direction: column; align-items: center; position: relative; }
.desk-hint { position: absolute; top: -36px; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; text-transform: uppercase; }
.desk-hint kbd { font-size: 9px; }

.desk-search {
  display: flex; align-items: center; gap: 10px; width: 100%; max-width: 500px;
  padding: 10px 16px; margin-bottom: 24px; background: rgba(255,255,255,0.5);
  border-radius: 10px; border: 1px solid rgba(0,0,0,0.06); opacity: 0;
  transition: opacity 0.2s;
}
.desk-search input { flex: 1; border: none; outline: none; background: transparent; font-size: 13px; color: var(--ink); }
.desesk-search input::placeholder { color: var(--ink-faint); }

.papers {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;
  max-width: 780px; width: 100%;
}
.paper {
  aspect-ratio: 4/5; background: #fff; border-radius: 8px; padding: 12px; cursor: pointer;
  position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
  transition: all 0.4s var(--ease);
}
.paper:hover { transform: translateY(-6px) scale(1.02); box-shadow: var(--shadow-lg); }
.paper.current { box-shadow: 0 0 0 2px var(--ink-faint), var(--shadow-md); }
.paper .p-title { font-size: 11px; font-weight: 500; color: var(--ink); margin-bottom: 6px; line-height: 1.4; }
.paper .p-text { flex: 1; font-size: 9px; line-height: 1.5; color: var(--ink-faint); opacity: 0.7; font-family: 'Literata', serif; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 10; -webkit-box-orient: vertical; }
.paper .p-meta { font-size: 8.5px; color: var(--ink-faint); opacity: 0.5; margin-top: 6px; display: flex; justify-content: space-between; }

/* DESK HOVER PREVIEW */
#desk-preview {
  position: fixed; right: 40px; top: 50%; transform: translateY(-50%);
  width: 240px; background: rgba(255,255,255,0.95); border: 1px solid rgba(0,0,0,0.08);
  border-radius: 12px; padding: 18px; pointer-events: none; opacity: 0;
  transition: opacity 0.2s; backdrop-filter: blur(12px); box-shadow: var(--shadow-md);
  z-index: 20;
}
#desk-preview.show { opacity: 1; }

/* INK RELICS */
#relics { background: rgba(0,0,0,0.92); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; }
#relics.show { opacity: 1; pointer-events: auto; }
.relic-close { position: absolute; top: 22px; right: 28px; font-size: 11px; color: rgba(255,255,255,0.45); cursor: pointer; }
.relic-close:hover { color: #fff; }
.relic-phrase { position: absolute; top: 22px; left: 28px; font-family: 'Literata', serif; font-size: 20px; color: var(--warm); font-style: italic; }
.relic-stack { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 90%; align-items: center; height: 60%; }
.relic-doc { width: 190px; min-height: 220px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 16px 18px; cursor: pointer; transition: all 0.35s; }
.relic-doc:hover { background: rgba(255,255,255,0.1); border-color: rgba(200,150,90,0.2); transform: translateY(-3px); }
.relic-doc .rd-title { font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,0.85); margin-bottom: 10px; }
.relic-doc .rd-text { font-family: 'Literata', serif; font-size: 11.5px; line-height: 1.65; color: rgba(255,255,255,0.5); white-space: pre-wrap; }
.relic-doc .rd-text mark { background: rgba(200,150,90,0.18); color: rgba(255,255,255,0.92); border-radius: 2px; padding: 0 2px; }

/* TIME BANDS */
#bands { background: var(--paper); opacity: 0; pointer-events: none; flex-direction: column; padding: 60px; overflow-y: auto; }
#bands.show { opacity: 1; pointer-events: auto; }
.bands-header { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 640px; margin-bottom: 28px; }
.bands-header h2 { font-family: 'Literata', serif; font-size: 20px; color: var(--ink); }
.bands-close { font-size: 11px; color: var(--ink-soft); cursor: pointer; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--ink-faint); transition: all 0.2s; }
.bands-close:hover { background: rgba(0,0,0,0.02); }
.band-list { display: flex; flex-direction: column; width: 100%; max-width: 640px; }
.band-row { display: flex; align-items: center; gap: 18px; padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.03); cursor: pointer; transition: background 0.3s; }
.band-row:hover { background: rgba(0,0,0,0.015); }
.band-time { width: 76px; font-size: 11px; color: var(--ink-faint); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.band-bar { width: 4px; height: 32px; border-radius: 2px; flex-shrink: 0; }
.band-text { font-size: 13px; color: var(--ink-soft); font-family: 'Literata', serif; }
.band-text:hover { color: var(--ink); }

/* BOOKMARK FOLD */
#fold { position: fixed; bottom: 0; right: 0; width: 80px; height: 80px; pointer-events: none; z-index: 160; }
#fold .corner { position: absolute; bottom: 0; right: 0; width: 60px; height: 60px; background: linear-gradient(135deg, transparent 50%, var(--ink-faint) 50%); opacity: 0; transform-origin: bottom right; transition: opacity 0.3s, transform 0.6s ease-out; }
#fold.show .corner { opacity: 1; }
#fold.open .corner { transform: scale(0); }

/* DIM LAYER */
.dim-layer { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.dim-layer.show { opacity: 1; pointer-events: auto; }

/* TOAST */
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.88); color: #fff; font-size: 12px; padding: 14px 28px; border-radius: 10px; z-index: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 360px; line-height: 1.6; text-align: center; }
.toast.show { opacity: 1; pointer-events: auto; cursor: pointer; }

/* SCENARIO TOUR */
.scenario-badge {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(139,115,85,0.12); color: var(--accent); padding: 6px 16px;
  border-radius: 20px; font-size: 11px; font-weight: 500; z-index: 300;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.scenario-badge.show { opacity: 1; }

.rc-faint {
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.4s, transform 0.4s var(--ease);
}
.rc-faint.show { opacity: 1; transform: translateY(0); }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 2px; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.02s !important; }
}
/* dock split item */
.dock-split-btn {
  display: block; width: 100%; padding: 6px 12px; margin-top: 4px;
  font-size: 11px; color: var(--ink-soft); background: none; border: 1px solid var(--ink-faint);
  border-radius: 6px; cursor: pointer; transition: background 0.15s;
  text-align: left;
}
.dock-split-btn:hover { background: rgba(0,0,0,0.03); color: var(--ink); }
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot" class="stage" onclick="dismissBoot()">
  <div class="boot-inner">
    <span class="boot-line">你打开渐晰，没有侧栏。纸铺满了屏幕。</span>
    <span class="boot-line">五条路径，不靠侧栏也能找到任何文档。</span>
    <span class="boot-line">点击任意处开始 · <kbd>Cmd+P</kbd> 搜索 · <kbd>Cmd+↑</kbd> 书桌 · <kbd>T</kbd> 时间带</span>
  </div>
</div>

<!-- SCENARIO BADGE -->
<div class="scenario-badge" id="scenarioBadge">场景 3.1 — 重新打开渐晰</div>

<!-- SURFACE -->
<div id="surface" class="stage">
  <div id="edge-top"></div>
  <div id="toolbar">
    <span>加粗</span><span>斜体</span><span>标题</span><span>H2</span><span>代码</span><span>链接</span>
  </div>
  <div id="tabs">
    <div class="tab-new" onclick="cmdNew()" title="新建 (Cmd+N)">+</div>
  </div>
  <div id="writer">
    <div class="doc-meta"><span class="doc-name" id="docName"></span></div>
    <div id="editor" contenteditable="true" spellcheck="false"></div>
    <div class="status"><span id="wordCount">0 字</span><span>Flow: <span style="color:var(--ink-faint)">off</span></span></div>
  </div>
  <div id="resonance"></div>
  
  <!-- SPLIT VIEW -->
  <div id="split-container">
    <div class="split-pane"><div class="split-close" onclick="closeSplit()">×</div><div class="split-editor" id="split-left" contenteditable></div></div>
    <div class="split-pane"><div class="split-close" style="display:none"></div><div class="split-editor" id="split-right" contenteditable></div></div>
  </div>
</div>

<!-- DOCK -->
<div id="dock">
  <div class="dock-tabs">
    <div class="dock-tab active" onclick="switchDockTab(0)">文件</div>
    <div class="dock-tab" onclick="switchDockTab(1)">大纲</div>
    <div class="dock-tab" onclick="switchDockTab(2)">AI对话</div>
  </div>
  <div class="dock-header">
    <span class="dock-title" id="dockTitle">最近活跃</span>
    <div style="display:flex;gap:2px">
      <button class="dock-btn" onclick="toggleDockPin()" id="dockPinBtn" title="固定">📌</button>
      <button class="dock-btn" onclick="toggleDock()" title="关闭 (Esc)">×</button>
    </div>
  </div>
  <div class="dock-list" id="dockList"></div>
</div>

<!-- OMNI-SEARCH -->
<div id="omni-overlay" onclick="if(event.target===this)closeOmni()">
  <div id="omni">
    <div class="omni-mode-bar">
      <div class="omni-mode active" data-mode="file" onclick="switchOmniMode('file')">文件搜索</div>
      <div class="omni-mode" data-mode="cmd" onclick="switchOmniMode('cmd')">命令模式</div>
      <div class="omni-mode" data-mode="panel" onclick="switchOmniMode('panel')">面板</div>
    </div>
    <div class="omni-input-wrap">
      <span class="prompt" id="omniPrompt">&gt;</span>
      <input id="omniInput" class="omni-input" placeholder="搜索文件名或正文..." oninput="doSearch(this.value)">
    </div>
    <div class="omni-results" id="omniResults"></div>
    <div class="omni-hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>Enter</kbd> 打开</span>
      <span><kbd>Esc</kbd> 关闭</span>
    </div>
  </div>
</div>

<!-- READING COMPLETION -->
<div id="reading" class="stage">
  <div class="rc-container">
    <div class="rc-box"><div class="rc-title" id="rcTitle"></div><div class="rc-time" id="rcTime"></div></div>
    <div class="rc-progress" id="rcProgress"><div class="rc-progress-bar" id="rcProgressBar"></div></div>
  </div>
  <div class="rc-ink-mark" id="rcInkMark">已读 · 存档标记</div>
  <div class="rc-suggestions" id="rcSuggestions"></div>
  <div class="rc-exit" id="rcExit" onclick="exitReading()">回到 Surface (Esc)</div>
</div>

<!-- DESK -->
<div id="desk" class="stage">
  <div class="desk-inner">
    <div class="desk-hint">The Desk · <kbd>Esc</kbd> 回到 Surface</div>
    <div class="papers" id="papers"></div>
  </div>
</div>

<!-- DESK HOVER PREVIEW -->
<div id="desk-preview">
  <div style="font-size:11px;font-weight:500;color:var(--ink);margin-bottom:6px" id="dp-title"></div>
  <div style="font-family:'Literata',serif;font-size:11px;line-height:1.6;color:var(--ink-soft);margin-bottom:8px;opacity:0.8" id="dp-text"></div>
  <div style="font-size:10px;color:var(--ink-faint);display:flex;justify-content:space-between" id="dp-meta"></div>
</div>

<!-- INK RELICS -->
<div id="relics" class="stage">
  <div class="relic-close" onclick="hideRelics()">关闭 (Esc)</div>
  <div class="relic-phrase" id="relicPhrase"></div>
  <div class="relic-stack" id="relicStack"></div>
</div>

<!-- TIME BANDS -->
<div id="bands" class="stage">
  <div class="bands-header">
    <h2>Time Bands</h2>
    <div class="bands-close" onclick="hideTimeBands()">关闭 (Esc)</div>
  </div>
  <div class="band-list" id="bandList"></div>
</div>

<!-- BOOKMARK FOLD -->
<div id="fold"><div class="corner"></div></div>

<!-- DIM LAYER -->
<div class="dim-layer" id="dim"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM STRIP -->
<div class="strip" id="strip">
  <button class="strip-btn" onclick="toggleDock()">📁 <u>D</u>ock</button>
  <span class="sep"></span>
  <button class="strip-btn" onclick="cmdNew()">📄 <u>N</u>ew</button>
  <span class="sep"></span>
  <button class="strip-btn" onclick="cmdOpen()">📂 <u>O</u>pen</button>
  <span class="sep"></span>
  <button class="strip-btn" onclick="openDesk()">🗂 Desk</button>
  <span class="sep"></span>
  <button class="strip-btn" onclick="openOmni()">🔍 <u>P</u> search</button>
  <span class="sep"></span>
  <button class="strip-btn" onclick="showTimeBands()">◴ Time</button>
  <span class="sep"></span>
  <button class="strip-btn" onclick="startReading()">▶ Read</button>
</div>

<script>
/* ═══════════════ DATA ═══════════════ */
const DOCS = [
  { id:1, name:'无侧栏设计方案.md', today:true,  hoursAgo:2,  words:448, text:'侧栏的真正功能不是文件管理 — 是安全感。去掉侧栏不能只做减法。必须提供等价的安心感，用全新的方式。' },
  { id:2, name:'数字极简.md',       today:false, hoursAgo:12, words:877, text:'注意力经济的核心悖论：我们以为是"工具使用我们"，实际是"我们喂养了注意力经济"。设计的责任不是让用户上瘾，而是帮助他们建立清晰的注意力边界。' },
  { id:3, name:'周会记录-0703.md',  today:true,  hoursAgo:6,  words:561, text:'讨论了 Q3 架构方向。PM提出需求：操作面板看完列表应回到之前滚动位置。深层问题是"操作"与"阅读"不只是模式切换。' },
  { id:4, name:'设计咨询备忘.md',   today:false, hoursAgo:28, words:634, text:'区分"可诉说的需求"和"沉默需求"。两段。Linear + Notion 混合路线。注意保留温暖感。' },
  { id:5, name:'Resonance 算法.md',  today:false, hoursAgo:40, words:1240,text:'BM25 实现细节 + 反向链接检测。时效衰减公式：w = (recentness + 0.1) / 2。阈值 0.42 以下不展示。' },
  { id:6, name:'attention.md',       today:false, hoursAgo:72, words:345, text:'注意力是唯一的货币。注意力的设计影响决策质量。注意力的经济学公式：Attention = f(irrelevance)。' },
  { id:7, name:'the-desk-concept.md',today:false, hoursAgo:96, words:1422,text:'The Desk 书桌层 — 空间记忆模型。位置 = 意义。最近活跃 = 伸手可及。稍远记忆 = 半透明在远角。最多 7±2 个。' },
];

const RESONANCE_DB = {
  '侧栏':   ['"侧栏真正的功能是安心的符号。" — 设计咨询备忘.md · 28h前'],
  '文件':   ['"文件管理不应该由用户承担。" — the-desk-concept.md · 96h前'],
  '注意力': ['"注意力经济的核心悖论..." — 数字极简.md · 12h前','"注意力是唯一的货币。" — attention.md · 72h前'],
  '设计':   ['"设计不是解决问题，是发现命题。" — 周会记录-0703.md · 6h前'],
  '安全感': ['"安全感来自确定感：东西没丢。" — 设计咨询备忘.md · 28h前'],
};

const INK_RELICS = [
  { phrase:'注意力', docs:[
    {name:'数字极简.md', text:'注意力经济的核心悖论:\n我们以为是"工具使用我们"\n实际是我们喂养了注意力经济'},
    {name:'attention.md', text:'注意力是唯一的货币。\n注意力的设计影响决策质量'},
  ]},
  { phrase:'设计', docs:[
    {name:'无侧栏设计方案.md', text:'设计的本质不是解决问题\n而是发现真正的命题'},
    {name:'设计咨询备忘.md', text:'"Linear + Notion 混合路线"\n保留温暖感'},
  ]},
];

const TIME_BANDS = [
  {time:'6:42 AM', color:'rgba(0,0,0,0.22)', text:'写 Surface · +4段'},
  {time:'6:58 AM', color:'rgba(0,0,0,0.06)', text:'coffee · paused 4min'},
  {time:'7:12 AM', color:'rgba(0,0,0,0.26)', text:'Resonance 段落 · +220字'},
  {time:'7:44 AM', color:'rgba(0,0,0,0.05)', text:'Cmd+↑ 重排 3 篇'},
  {time:'8:02 AM', color:'rgba(0,0,0,0.18)', text:'回 Surface · 改前2段'},
  {time:'9:20 AM', color:'rgba(0,0,0,0.28)', text:'冲刺写完 · +400字'},
  {time:'10:00 AM',color:'rgba(0,0,0,0.08)', text:'书桌 · 发现被遗忘笔记'},
  {time:'10:30 AM',color:'rgba(0,0,0,0.14)', text:'回 Surface · 打磨末段'},
  {time:'现在',   color:'transparent',   text:'你在读这段文字'},
];

const COMMANDS = [
  {icon:'📄', name:'新建文档', desc:'当前标签新建空白页'},
  {icon:'📂', name:'打开文件...', desc:'系统对话框选择 .md/.txt'},
  {icon:'💾', name:'保存', desc:'保存当前文档'},
  {icon:'🔄', name:'重新加载', desc:'从磁盘重新加载'},
  {icon:'👁',  name:'切换预览', desc:'编辑/预览模式切换'},
  {icon:'🗂', name:'打开书桌', desc:'全景空间记忆导航'},
  {icon:'⏱', name:'时间带', desc:'查看一天写作记录'},
  {icon:'🎯', name:'专注模式', desc:'进入沉浸写作'},
];

const PANELS = [
  {icon:'📋', name:'文件列表', desc:'平铺 / 最近活跃', action:() => toggleDock()},
  {icon:'📑', name:'大纲面板', desc:'当前文档标题导航', action:() => {toggleDock(); switchDockTab(1);}},
  {icon:'🤖', name:'AI 对话', desc:'写作助手侧栏', action:() => {toggleDock(); switchDockTab(2);}},
  {icon:'📝', name:'灵感记录', desc:'全局速记面板', action:() => showToast('灵感面板: 全局速记 (Cmd+Shift+.)')},
];

/* ═══════════════ STATE ═══════════════ */
let state = {
  bootDone: false,
  tabs: [{id:1, name:DOCS[0].name, contentId:1}],
  activeTab: 0,
  currentDoc: DOCS[0],
  dock: {open:false, pinned:false, tab:0},
  omni: {open:false, mode:'file', activeIdx:0, query:'', results:[]},
  reading: {active:false, phase:0, timer:null},
  desk: {open:false},
  split: {active:false, left:null, right:null},
};

/* ═══════════════ BOOT ═══════════════ */
function dismissBoot() {
  document.getElementById('boot').classList.add('gone');
  state.bootDone = true;
  setTimeout(() => document.getElementById('boot').style.display = 'none', 900);
  showBookmarkFold();
  renderTabs();
  switchTab(0);
}

function showBookmarkFold() {
  const f = document.getElementById('fold');
  f.classList.add('show');
  setTimeout(() => f.classList.add('open'), 600);
  setTimeout(() => f.classList.remove('show','open'), 1800);
}

/* ═══════════════ TABS ═══════════════ */
function renderTabs() {
  const c = document.getElementById('tabs');
  c.innerHTML = state.tabs.map((t,i) => `
    <div class="tab ${i===state.activeTab?'active':''}" onclick="switchTab(${i})">
      ${t.name}<span class="tab-close" onclick="event.stopPropagation();closeTab(${i})">×</span>
    </div>
  `).join('') + `<div class="tab-new" onclick="cmdNew()" title="新建 (Cmd+N)">+</div>`;
}

function switchTab(i) {
  state.activeTab = i;
  const t = state.tabs[i];
  state.currentDoc = DOCS.find(d => d.id === t.contentId) || DOCS[0];
  document.getElementById('docName').textContent = state.currentDoc.name;
  document.getElementById('editor').innerHTML = `<p>${state.currentDoc.text}</p>`;
  document.getElementById('wordCount').textContent = state.currentDoc.words + ' 字';
  renderTabs();
}

function closeTab(i) {
  if (state.tabs.length === 1) return;
  state.tabs.splice(i,1);
  if (state.activeTab >= state.tabs.length) state.activeTab = state.tabs.length - 1;
  switchTab(state.activeTab);
}

function cmdNew() {
  if (!state.bootDone) return;
  const id = Date.now() % 10000;
  const name = `未命名-${id}.md`;
  const newDoc = {id, name, today:true, hoursAgo:0, words:0, text:'开始写作...'};
  DOCS.push(newDoc);
  state.tabs.push({id, name, contentId:id});
  switchTab(state.tabs.length - 1);
  showToast('新建: ' + name);
}

function cmdOpen() {
  if (!state.bootDone) return;
  // 模拟打开文件 — 从列表中选第一个未打开的
  const openedIds = state.tabs.map(t => t.contentId);
  const unopened = DOCS.find(d => !openedIds.includes(d.id));
  if (unopened) {
    state.tabs.push({id:unopened.id, name:unopened.name, contentId:unopened.id});
    switchTab(state.tabs.length - 1);
  } else {
    showToast('所有文档都已打开');
  }
}

/* ═══════════════ DOCK (Path B) ═══════════════ */
function toggleDock() {
  if (!state.bootDone) return;
  state.dock.open = !state.dock.open;
  document.getElementById('dock').classList.toggle('open', state.dock.open);
  document.getElementById('surface').classList.toggle('dock-open', state.dock.open);
  if (state.dock.open) renderDock();
}

function toggleDockPin() {
  state.dock.pinned = !state.dock.pinned;
  document.getElementById('dockPinBtn').style.color = state.dock.pinned ? 'var(--accent)' : '';
}

function switchDockTab(i) {
  state.dock.tab = i;
  document.querySelectorAll('.dock-tab').forEach((t,j) => t.classList.toggle('active', j===i));
  const titles = ['最近活跃', '文档大纲', 'AI 对话...'];
  document.getElementById('dockTitle').textContent = titles[i];
  renderDock();
}

function renderDock() {
  const c = document.getElementById('dockList');
  if (state.dock.tab === 0) {
    const sorted = [...DOCS].sort((a,b) => a.hoursAgo - b.hoursAgo);
    c.innerHTML = sorted.map(d => `
      <div class="dock-item ${d.id===state.currentDoc.id?'current':''}" onclick="openDockDoc(${d.id})">
        <div class="dock-item-name">${d.name}</div>
        <div class="dock-item-preview">${d.text.substring(0,36)}…</div>
        <div class="dock-item-meta"><span>${d.words}字</span><span>${fmtTime(d.hoursAgo)}</span></div>
      </div>`).join('') + `<button class="dock-split-btn" onclick="event.stopPropagation();openSplitDemo()">⇆ 对照右侧</button>`;
  } else if (state.dock.tab === 1) {
    c.innerHTML = `
      <div style="padding:12px;font-size:11px;color:var(--ink-faint)">当前文档大纲</div>
      <div style="padding:6px 12px 6px 16px;font-size:12.5px;color:var(--ink);margin-bottom:4px">侧栏的真正功能不是文件管理</div>
      <div style="padding:6px 12px 6px 28px;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px">推翻的假设</div>
      <div style="padding:6px 12px 6px 28px;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px">四条红线</div>
      <div style="padding:6px 12px 6px 28px;font-size:11.5px;color:var(--ink-soft)">五条入口路径</div>`;
  } else {
    c.innerHTML = `
      <div style="padding:12px;font-size:11.5px;color:var(--ink-faint);line-height:1.6">AI 对话面板<br>暂未连接模型。</div>
      <div style="padding:8px 12px;background:rgba(0,0,0,0.02);margin:0 8px;border-radius:8px;font-size:11px;color:var(--ink-soft)">
        输入问题,或点击下方快捷操作。
      </div>`;
  }
}

function openDockDoc(id) {
  const doc = DOCS.find(d => d.id === id);
  if (!doc) return;
  // 检查 tab 是否已存在
  const existing = state.tabs.findIndex(t => t.contentId === id);
  if (existing >= 0) {
    switchTab(existing);
  } else {
    state.tabs.push({id:doc.id, name:doc.name, contentId:id});
    switchTab(state.tabs.length - 1);
  }
  if (!state.dock.pinned) toggleDock();
}

/* ═══════════════ OMNI-SEARCH (Path D) ═══════════════ */
function openOmni() {
  if (!state.bootDone) return;
  state.omni.open = true;
  state.omni.mode = 'file';
  document.getElementById('omni-overlay').classList.add('show');
  document.getElementById('omniInput').value = '';
  document.getElementById('omniInput').focus();
  switchOmniMode('file');
  doSearch('');
}

function closeOmni() {
  state.omni.open = false;
  document.getElementById('omni-overlay').classList.remove('show');
}

function switchOmniMode(m) {
  state.omni.mode = m;
  document.querySelectorAll('.omni-mode').forEach(el => el.classList.toggle('active', el.dataset.mode === m));
  document.getElementById('omniPrompt').textContent = m === 'cmd' ? '>' : m === 'panel' ? '面板:' : '搜索:';
  document.getElementById('omniInput').placeholder = m === 'file' ? '搜索文件名或正文...' : m === 'cmd' ? '输入 > 查看命令' : '输入面板名称...';
  doSearch('');
}

function doSearch(q) {
  state.omni.query = q.trim();
  state.omni.activeIdx = 0;
  const resultsEl = document.getElementById('omniResults');

  if (state.omni.mode === 'cmd') {
    const filtered = COMMANDS.filter(c => !q.toLowerCase() || c.name.toLowerCase().includes(q.toLowerCase()));
    resultsEl.innerHTML = filtered.map((c,i) => `
      <div class="omni-command ${i===0?'active':''}" onclick="execCommand(${i})">
        <div class="omni-cmd-icon">${c.icon}</div>
        <div><div class="omni-cmd-name">${c.name}</div><div class="omni-cmd-desc">${c.desc}</div></div>
      </div>`).join('') || '<div class="omni-empty">无命令</div>';
    return;
  }

  if (state.omni.mode === 'panel') {
    const filtered = PANELS.filter(c => !q.toLowerCase() || c.name.toLowerCase().includes(q.toLowerCase()));
    resultsEl.innerHTML = filtered.map((c,i) => `
      <div class="omni-command ${i===0?'active':''}" onclick="execPanel(${i})">
        <div class="omni-cmd-icon">${c.icon}</div>
        <div><div class="omni-cmd-name">${c.name}</div><div class="omni-cmd-desc">${c.desc}</div></div>
      </div>`).join('') || '<div class="omni-empty">无匹配面板</div>';
    return;
  }

  // file mode
  if (!state.omni.query) {
    // Show recent
    const recent = [...DOCS].sort((a,b) => a.hoursAgo - b.hoursAgo).slice(0,6);
    resultsEl.innerHTML = recent.map((d,i) => renderResult(d,i,false)).join('');
    state.omni.results = recent;
    return;
  }

  const query = state.omni.query.toLowerCase();
  const scored = DOCS.map(d => {
    let score = 0;
    if (d.name.toLowerCase().includes(query)) score += 10;
    if (d.text.toLowerCase().includes(query)) score += 5;
    if (d.today) score += 2;
    score += Math.max(0, 3 - d.hoursAgo / 24);
    // fuzzy
    let qi = 0;
    for (let c = 0; c < d.name.length && qi < query.length; c++) {
      if (d.name[c].toLowerCase() === query[qi]) qi++;
    }
    if (qi === query.length) score += 3;
    return {...d, score};
  }).filter(d => d.score > 0).sort((a,b) => b.score - a.score);

  state.omni.results = scored.slice(0,8);
  resultsEl.innerHTML = scored.slice(0,8).map((d,i) => renderResult(d,i,true)).join('') || '<div class="omni-empty">无匹配结果</div>';
}

function renderResult(d, i, isMatch) {
  const active = i === state.omni.activeIdx ? ' active' : '';
  return `<div class="omni-result${active}" onclick="openResult(${i})" onmouseenter="hoverResult(${i})">
    <div class="omni-result-icon">${isMatch ? '◆' : '◴'}</div>
    <div class="omni-result-text">
      <div class="omni-result-title">${d.name}</div>
      <div class="omni-result-snippet">${d.text.substring(0,45)}…</div>
    </div>
    <div class="omni-result-meta">${fmtTime(d.hoursAgo)}<br>${d.words}字</div>
  </div>`;
}

function hoverResult(i) {
  state.omni.activeIdx = i;
  updateResultSelection();
}

function updateResultSelection() {
  document.querySelectorAll('.omni-result').forEach((el,i) => el.classList.toggle('active', i === state.omni.activeIdx));
}

function omniMove(d) {
  const max = state.omni.results.length;
  if (!max) return;
  state.omni.activeIdx = (state.omni.activeIdx + d + max) % max;
  updateResultSelection();
  document.querySelectorAll('.omni-result')[state.omni.activeIdx]?.scrollIntoView({block:'nearest'});
}

function omniEnter() {
  const doc = state.omni.results[state.omni.activeIdx];
  if (!doc) return;
  openResult(state.omni.activeIdx);
}

function openResult(i) {
  const doc = state.omni.results[i];
  if (!doc) return;
  const existing = state.tabs.findIndex(t => t.contentId === doc.id);
  if (existing >= 0) switchTab(existing);
  else { state.tabs.push({id:doc.id, name:doc.name, contentId:doc.id}); switchTab(state.tabs.length-1); }
  closeOmni();
}

/* ═══════════════ READING COMPLETION (Path A — completion trigger) ═══════════════ */
function startReading() {
  if (!state.bootDone) return;
  if (state.reading.active) return;
  state.reading.active = true;
  state.reading.phase = 0;

  const reading = document.getElementById('reading');
  const title = document.getElementById('rcTitle');
  const time = document.getElementById('rcTime');
  title.textContent = state.currentDoc.name;
  time.textContent = '阅读用时 ' + Math.floor(Math.random()*5+2) + ':' + String(Math.floor(Math.random()*60)).padStart(2,'0');
  
  reading.classList.add('show');
  document.getElementById('scenarioBadge').textContent = '场景 3.4 — 阅读完成';
  document.getElementById('scenarioBadge').classList.add('show');
  
  const progress = document.getElementById('rcProgress');
  const bar = document.getElementById('rcProgressBar');
  const inkMark = document.getElementById('rcInkMark');
  const exit = document.getElementById('rcExit');
  const sug = document.getElementById('rcSuggestions');

  // Reset
  progress.classList.remove('show');
  inkMark.classList.remove('show');
  sug.classList.remove('show');
  exit.classList.remove('show');
  bar.style.width = '0%';

  // Phase 1: 3s — 已读标记
  state.reading.timer = setTimeout(() => {
    inkMark.classList.add('show');
    progress.classList.add('show');
  }, 3000);

  // Phase 2: 5s — 浮现推荐
  state.reading.timer = setTimeout(() => {
    renderReadingSuggestions();
    sug.classList.add('show');
  }, 5000);

  // Phase 3: 7s — progress bar
  state.reading.timer = setTimeout(() => {
    bar.style.width = '100%';
    exit.classList.add('show');
  }, 7000);

  // Phase 4: 10s — auto close (ponytail: fold to ink line = exit)
  state.reading.timer = setTimeout(() => {
    if (state.reading.active) exitReading();
  }, 10000);
}

function renderReadingSuggestions() {
  const current = state.currentDoc;
  const others = DOCS.filter(d => d.id !== current.id);
  
  // Same-folder recent (路径亲近)
  const sameFolder = others.sort((a,b) => a.hoursAgo - b.hoursAgo)[0];
  // Resonance semantic (语义亲近) 
  const resMatch = Object.entries(RESONANCE_DB).find(([k,t]) => current.text.includes(k));
  const resonance = resMatch ? DOCS.find(d => resMatch[1][0].includes(d.name)) || others[0] : others[1];
  // Ink Relics (记忆亲近)
  const inkRelic = INK_RELICS.find(r => current.text.includes(r.phrase));
  const inkDoc = inkRelic ? DOCS.find(d => d.name === inkRelic.docs[0].name) || others[2] : others[2];

  const container = document.getElementById('rcSuggestions');
  container.innerHTML = `
    <div class="rc-card" onclick="exitReading();openDockDoc(${sameFolder.id})">
      <div class="rc-type">路径亲近 — 同文件夹最近活跃</div>
      <div class="rc-quote">${sameFolder.text.substring(0,50)}…</div>
    </div>
    <div class="rc-card" onclick="exitReading();openDockDoc(${resonance.id})">
      <div class="rc-type">语义亲近 — Resonance 推荐</div>
      <div class="rc-quote">${resonance.text.substring(0,50)}…</div>
    </div>
    <div class="rc-card" onclick="exitReading();openDockDoc(${inkDoc.id})">
      <div class="rc-type">记忆亲近 — Ink Relic / Bookmark</div>
      <div class="rc-quote">${inkDoc.text.substring(0,50)}…</div>
    </div>`;
}

function exitReading() {
  state.reading.active = false;
  document.getElementById('reading').classList.remove('show');
  document.getElementById('scenarioBadge').classList.remove('show');
}

/* ═══════════════ RESONANCE (Path A — pause trigger) ═══════════════ */
const editor = document.getElementById('editor');
let resTimer = null;

editor.addEventListener('input', () => {
  if (!state.bootDone) return;
  clearTimeout(resTimer);
  resTimer = setTimeout(triggerResonance, 2500);
});
editor.addEventListener('blur', () => {
  clearTimeout(resTimer);
  document.getElementById('resonance').classList.remove('show');
});

function triggerResonance() {
  const text = editor.innerText;
  // Check for known keys first
  for (const [key, items] of Object.entries(RESONANCE_DB)) {
    if (text.includes(key)) {
      showResonance(items, 'Resonance 共鸣');
      return;
    }
  }
  // Low-confidence fallback: show recent active files
  const recent = [...DOCS].sort((a,b) => a.hoursAgo - b.hoursAgo).slice(0,3);
  const fallbackItems = recent.map(d => `"${d.text.substring(0,20)}…" — ${d.name} · ${fmtTime(d.hoursAgo)}`);
  showResonance(fallbackItems, '近期活跃');
}

function showResonance(items, label) {
  const layer = document.getElementById('resonance');
  layer.innerHTML = items.map(t => {
    const idx = t.lastIndexOf(' — ');
    const quote = idx > 0 ? t.slice(0, idx) : t;
    const src = idx > 0 ? `<span class="label">${label}</span> ${t.slice(idx+3)}` : '';
    return `<div class="res-item"><div class="quote">${quote}</div><div class="src">${src}</div></div>`;
  }).join('');
  layer.classList.add('show');
  setTimeout(() => layer.classList.remove('show'), 6000);
}

/* ═══════════════ DESK (Path C) ═══════════════ */
let deskAutoReturnTimer = null;
function openDesk() {
  if (!state.bootDone) return;
  state.desk.open = true;
  document.getElementById('desk').classList.add('show');
  document.getElementById('scenarioBadge').textContent = '场景 3.1b — 书桌全景';
  document.getElementById('scenarioBadge').classList.add('show');
  document.getElementById('resonance').classList.remove('show');
  renderDesk();
  dimSurface();
  //ponytail: 15s auto close, cancel if user interacts
  clearTimeout(deskAutoReturnTimer);
  deskAutoReturnTimer = setTimeout(() => {
    if (state.desk.open) closeDesk();
  }, 15000);
}

function closeDesk() {
  state.desk.open = false;
  document.getElementById('desk').classList.remove('show');
  document.getElementById('scenarioBadge').classList.remove('show');
  document.getElementById('desk-preview').classList.remove('show');
  undimSurface();
}

function renderDesk() {
  const c = document.getElementById('papers');
  const sorted = [...DOCS].sort((a,b) => a.hoursAgo - b.hoursAgo).slice(0,9);
  c.innerHTML = sorted.map((d,i) => `
    <div class="paper ${d.id===state.currentDoc.id?'current':''}" 
         onclick="deskOpenDoc(${d.id})"
         onmouseenter="deskHover(${d.id},this)">
      <div class="p-title">${d.name}</div>
      <div class="p-text">${d.text}</div>
      <div class="p-meta"><span>${d.words}w</span><span>${fmtTime(d.hoursAgo)}</span></div>
    </div>
  `).join('');
}

function deskHover(id, el) {
  const doc = DOCS.find(d => d.id === id);
  if (!doc) return;
  document.getElementById('dp-title').textContent = doc.name;
  document.getElementById('dp-text').textContent = doc.text;
  document.getElementById('dp-meta').innerHTML = `<span>${doc.words} 字</span><span>${fmtTime(doc.hoursAgo)}</span>`;
  document.getElementById('desk-preview').classList.add('show');
}

function deskOpenDoc(id) {
  closeDesk();
  const existing = state.tabs.findIndex(t => t.contentId === id);
  if (existing >= 0) switchTab(existing);
  else {
    const doc = DOCS.find(d => d.id === id);
    state.tabs.push({id:doc.id, name:doc.name, contentId:id});
    switchTab(state.tabs.length-1);
  }
  showBookmarkFold();
}

/* ═══════════════ INK RELICS ═══════════════ */
function showRelics(phrase) {
  if (!state.bootDone) return;
  const relic = INK_RELICS.find(r => phrase.includes(r.phrase));
  if (!relic) { showToast('No Ink Relic for "' + phrase + '"'); return; }
  document.getElementById('relicPhrase').textContent = relic.phrase;
  document.getElementById('relicStack').innerHTML = relic.docs.map((d,i) => {
    const text = d.text.replace(new RegExp('('+relic.phrase+')','g'),'<mark>$1</mark>');
    return `<div class="relic-doc" style="--i:${i}" onclick="hideRelics()">
      <div class="rd-title">${d.name}</div><div class="rd-text">${text}</div></div>`;
  }).join('');
  document.getElementById('relics').classList.add('show');
  dimSurface();
}

function hideRelics() {
  document.getElementById('relics').classList.remove('show');
  undimSurface();
}

/* ═══════════════ TIME BANDS ═══════════════ */
function showTimeBands() {
  if (!state.bootDone) return;
  document.getElementById('bandList').innerHTML = TIME_BANDS.map(t => `
    <div class="band-row">
      <div class="band-time">${t.time}</div>
      <div class="band-bar" style="background:${t.color}"></div>
      <div class="band-text">${t.text}</div>
    </div>`).join('');
  document.getElementById('bands').classList.add('show');
  dimSurface();
}

function hideTimeBands() {
  document.getElementById('bands').classList.remove('show');
  undimSurface();
}

/* ═══════════════ SPLIT VIEW (场景 3.3) ═══════════════ */
function openSplitDemo() {
  //ponytail: split current doc + first other doc for comparison
  const others = DOCS.filter(d => d.id !== state.currentDoc.id);
  const rightDoc = others.sort((a,b) => a.hoursAgo - b.hoursAgo)[0];
  openSplit(rightDoc.id);
}

function openSplit(docId) {
  // Close dock when opening split
  if (state.dock.open) toggleDock();
  
  const doc = DOCS.find(d => d.id === docId);
  if (!doc) return;
  state.split.active = true;
  // Left = current doc, right = chosen doc
  document.getElementById('split-left').innerHTML = `<p>${state.currentDoc.text}</p>`;
  document.getElementById('split-right').innerHTML = `<p>${doc.text}</p>`;
  document.getElementById('split-container').classList.add('active');
}

function closeSplit() {
  state.split.active = false;
  document.getElementById('split-container').classList.remove('active');
}

/* ═══════════════ HELPERS ═══════════════ */
function dimSurface() { document.getElementById('surface').classList.add('dimed'); }
function undimSurface() { document.getElementById('surface').classList.remove('dimed'); }

function fmtTime(h) {
  if (h < 1) return '刚刚';
  if (h < 24) return h + '小时前';
  return Math.floor(h / 24) + '天前';
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ═══════════════ KEYBOARD ═══════════════ */
document.addEventListener('keydown', e => {
  const inEditor = document.activeElement === editor;
  const inOmniInput = document.activeElement === document.getElementById('omniInput');

  // Close overlays even when typing (harmless)
  if (e.key === 'Escape') {
    if (state.omni.open) { e.preventDefault(); closeOmni(); return; }
    if (document.getElementById('relics').classList.contains('show')) { e.preventDefault(); hideRelics(); return; }
    if (document.getElementById('bands').classList.contains('show')) { e.preventDefault(); hideTimeBands(); return; }
    if (document.getElementById('reading').classList.contains('show')) { e.preventDefault(); exitReading(); return; }
    if (state.desk.open) { e.preventDefault(); closeDesk(); return; }
    if (state.dock.open && !state.dock.pinned) { e.preventDefault(); toggleDock(); return; }
    return;
  }

  // Omni open/select: only when omni input focused
  if (state.omni.open) {
    if (inOmniInput) {
      if (e.key === 'ArrowDown') { e.preventDefault(); omniMove(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); omniMove(-1); return; }
      if (e.key === 'Enter') { e.preventDefault(); omniEnter(); return; }
    }
    return;
  }

  // Cmd+shortcuts: skip while typing in editor so normal editing works
  if (inEditor) return;

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); openOmni(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'e') { e.preventDefault(); toggleDock(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowUp') { e.preventDefault(); openDesk(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowDown') { e.preventDefault(); if(state.desk.open) closeDesk(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); cmdNew(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); cmdOpen(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 't') { e.preventDefault(); showTimeBands(); return; }
  if (e.key.toLowerCase() === 't' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    document.getElementById('bands').classList.contains('show') ? hideTimeBands() : showTimeBands();
    return;
  }
});

// Selection detector for Ink Relics
document.addEventListener('mouseup', () => {
  const s = window.getSelection().toString().trim();
  if (s && s.length >= 2 && s.length <= 8) {
    const matched = INK_RELICS.find(r => s.includes(r.phrase) || r.phrase.includes(s));
    if (matched) showToast('"' + matched.phrase + '" → 尝试底部按钮"时间带"查看');
  }
});

// Initialize
editor.innerHTML = '<p>' + DOCS[0].text + '</p>';
document.getElementById('docName').textContent = DOCS[0].name;
document.getElementById('wordCount').textContent = DOCS[0].words + ' 字';
</script>
